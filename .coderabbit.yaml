# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ru-RU"
tone_instructions: "Пиши по-русски, кратко и по существу. DeepLagoon — 18+ проект SS14: взрослый контент намеренный. Английские name/desc, термины, названия реагентов, команды и идентификаторы допустимы. Объясняй конкретную ошибку и её последствия."
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  path_filters:
    - "!.local/**"
    - "!RobustToolbox/**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/node_modules/**"
    - "!TGUI/dist/**"
    - "!TGUI/.vite/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.webp"
    - "!**/*.ogg"
    - "!**/*.mp3"
    - "!**/*.wav"
    - "!**/*.dll"
    - "!**/*.so"
    - "!**/*.pdb"
    - "!**/*.exe"
    - "!**/*.eot"
    - "!**/*.ttf"
    - "!**/*.otf"
    - "!**/*.woff"
    - "!**/*.woff2"
    - "!**/*.psd"
    - "!**/*.mid"
    - "!**/*.js.map"
    - "!**/*.css.map"
    - "!**/*.gz"
    - "!**/*.zip"

  path_instructions:
    - path: "**"
      instructions: |
        DeepLagoon Station — 18+ ролевая игра Space Station 14, форк Monolith/Frontier
        на C# и RobustToolbox. Это не SS13/BYOND: не предлагай DM-макросы, qdel,
        Destroy(), addtimer, подсистемы SS13 или прямое копирование чужих механик.
        Взрослый, сексуальный и эротический контент в коде, текстах и комментариях
        намеренный. Не требуй его удаления и не оценивай уместность тематики.
        Сосредоточься на воспроизводимых ошибках, безопасности, производительности
        и регрессиях поведения. Проверки согласия, доступа и прав остаются значимыми.
        Учитывай AGENTS.md, .editorconfig и соседний код. Не требуй массового
        переформатирования или исправления старых проблем вне изменений PR.
        Для замечания указывай конкретный сценарий, место ошибки и последствие;
        не выдавай предположение или отсутствие ручной проверки за доказанный баг.
        Новые механики адаптируй к существующим системам SS14. Собственный контент
        обычно размещается в _DeepLagoon; не требуй переноса унаследованных файлов.
        Английские name/desc, технические термины, программные отсылки, пародии
        на команды, названия реагентов и игровые идентификаторы допустимы.
        Новые сообщения игроку, подписи UI и подсказки должны быть по-русски,
        кроме этих исключений. Не требуй перевода исходной английской локали.
        Проверяй сохранность лицензий и атрибуции импортированных ресурсов.

    - path: "**/*.cs"
      instructions: |
        Используй соглашения C# из .editorconfig: пробелы, PascalCase для типов
        и методов, camelCase для локальных переменных, _camelCase для обычных
        закрытых полей. Учитывай исключения для констант и static readonly.
        Предпочитай ранний выход и существующие константы, CVar и DataField
        для настраиваемых значений; не предлагай #define вместо констант C#.
        Сохраняй ECS: данные в компонентах, поведение в EntitySystem и событиях.
        Проверяй EntityUid через подходящие TryComp/Exists/Terminating проверки
        с учётом жизненного цикла; используй штатные системы удаления сущностей,
        включая QueueDel там, где удаление во время обхода коллекции небезопасно.
        Компоненты с отложенным использованием могут быть удалены до callback.
        Очищай ручные подписки, таймеры и IDisposable при соответствующем завершении
        жизненного цикла. Не требуй ручной отписки от автоматически управляемых
        SubscribeLocalEvent или обнуления всех ссылок ради сборщика мусора .NET.
        Для игровых задержек и отменяемых действий используй существующие DoAfter,
        таймеры и IGameTiming; не блокируй игровой поток ожиданием I/O или sleep.
        Избегай полного обхода сущностей каждый кадр; используй штатные запросы
        и события. Проверяй очистку кэшей и состояние после удаления и нового раунда.
        Проверяй DataField, сериализацию и совместимость сохранений. Для сетевых
        компонентов учитывай NetworkedComponent, AutoNetworkedField и Dirty
        по принятой в соседнем коде схеме. На сетевой границе проверяй NetEntity
        и преобразование координат между сущностью, гридом, картой и миром.
        Видимые игроку C#-строки обычно получаются через Loc.GetString/Fluent;
        логи, исключения, ключи локализации и идентификаторы не требуют перевода.

    - path: "Content.Server/**"
      instructions: |
        Сервер авторитетен для действий, доступа, инвентаря, строительства,
        экономики и сохранений. Не доверяй данным клиента или видимости кнопки UI.
        Проверяй отправителя, действующую сессию/BUI, права, цель, дистанцию,
        допустимые значения и состояние игры в соответствии с механикой.
        Админские и мапперские действия должны использовать существующую модель
        прав. Сохраняй проверки согласия и доступа в интеракциях персонажей.
        Для операций Lagoon Coin и покупок проверяй серверную цену, владение,
        идемпотентность, повтор запроса и конкурентные списания.

    - path: "Content.{Client,Shared}/**"
      instructions: |
        Content.Client и загружаемая клиентом Content.Shared работают в sandbox.
        Проверяй доступность API и IL для type checker RobustToolbox, а не только
        успешную компиляцию. Не обходи подписи, доверие загрузчика, аутентификацию
        и совместимость официального клиента. Изменения движка выполняются в
        отдельном репозитории RobustToolbox, затем обновляется проверенный pin.
        Для prediction и сетевых событий проверяй повторное применение эффектов,
        синхронизацию и разграничение клиентской визуализации и серверных действий.
        При изменениях клиентских сборок учитывай ClientModulesPassEngineTypeChecks
        и, когда доступен установленный движок, проверку с официальным launcher.
        Сборка не доказывает загрузку клиента, корректный вид UI или поведение в игре.

    - path: "Resources/Prototypes/**/*.yml"
      instructions: |
        Это прототипы SS14: проверяй уникальность id в соответствующем типе,
        parent и наследование, abstract, имена компонентов и DataField,
        ссылки на прототипы, RSI-состояния, звуки и ключи локализации.
        Сохраняй идентификаторы, используемые в картах, сохранениях и других
        прототипах, либо проверяй миграцию. Новые прототипы DeepLagoon обычно
        находятся в Resources/Prototypes/_DeepLagoon. Отступы YAML — два пробела.
        Не требуй перевода id, путей ресурсов и допустимых английских name/desc.

    - path: "Resources/Locale/**/*.ftl"
      instructions: |
        Это Fluent. Проверяй синтаксис, атрибуты, селекторы, аргументы и совпадение
        ключей с вызовами Loc.GetString и ссылками в прототипах.
        В ru-RU проверяй русский текст и формы множественного числа с учётом
        допустимых английских терминов, названий и отсылок. В en-US английский
        ожидаем: не требуй его замены русским и не меняй ключи ради перевода.

    - path: "Resources/Maps/**"
      instructions: |
        Карты SS14 сериализованы в YAML, это не DMM. Проверяй ссылки на прототипы,
        компоненты и связи сущностей, данные гридов, точки появления и стыковки.
        Не предлагай массовую ручную пересериализацию карты ради стиля.
        Учитывай загрузку карты сервером; текстовый diff не доказывает её играбельность.

    - path: "Resources/Textures/**/*.rsi/meta.json"
      instructions: |
        Это метаданные RSI: проверяй размер кадров, уникальность состояний,
        directions/delays и согласованность с используемыми именами состояний.
        Учитывай copyright/license. Не делай вывод о внешнем виде спрайта по JSON.

    - path: "Content.Client/**/*.xaml"
      instructions: |
        Это UI RobustToolbox, не WPF. Используй существующие контролы, привязки,
        локализацию и соглашения соседних окон. Проверяй минимальные размеры,
        масштаб UI, переполнение, ввод и освобождение ресурсов при закрытии.
        Сохраняй явно заданное расположение элементов и существующие действия.

    - path: "TGUI/**/*.{ts,tsx,js,jsx,scss}"
      instructions: |
        Этот порт TGUI использует React, Vite, pnpm и Robust.Client.WebView,
        а не Inferno или BYOND WebView2. React hooks допустимы; соблюдай их правила.
        Для нового локального состояния функциональных компонентов предпочитай
        useState. useLocalState — совместимый Redux-механизм: его setter вызывает
        перерисовку всего дерева; не вызывай его во время render.
        Проверяй контракт useBackend/data/act с C#-обработчиком и серверную валидацию.
        Не применяй правила точности чисел и API BYOND к этому порту.
        Не выдавай внешним страницам доступ к TGUI bridge. Проверяй экранирование
        недоверенного HTML и существующую политику загрузки ресурсов.
        Для производственных интерфейсов сохраняй нативный SS14 fallback,
        выбор стиля, обработку отказа браузера и несохранённые данные редакторов.
        Подписи и сообщения игроку — по-русски с общими исключениями для терминов
        и названий. Сохраняй общий визуальный стиль и компоненты оболочек проекта.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[ci skip]"

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: "local"
