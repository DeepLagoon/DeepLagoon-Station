name: Render PR map diff

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: map-diff-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect map changes against PR merge base
        id: maps
        run: python Tools/map_diff/build.py plan --event "$GITHUB_EVENT_PATH" --output .local/codex/map-diff-ci/report
      - name: Install image/report dependencies
        run: python -m pip install -r Tools/map_diff/requirements.txt
      - uses: ./.github/actions/prepare-engine
        if: steps.maps.outputs.changed == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.maps.outputs.changed == 'true'
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        if: steps.maps.outputs.changed == 'true'
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: TGUI/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4.1.0
        if: steps.maps.outputs.changed == 'true'
        with:
          dotnet-version: 10.0.x
      - name: Build MapRenderer
        if: steps.maps.outputs.changed == 'true'
        run: dotnet build Content.MapRenderer/Content.MapRenderer.csproj --configuration Release /p:WarningsAsErrors=nullable /m
      - name: Render before/after and build report
        if: steps.maps.outputs.changed == 'false' || success()
        run: python Tools/map_diff/build.py build --output .local/codex/map-diff-ci/report
      - name: Upload report
        if: always() && steps.maps.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: station-map-diff
          path: .local/codex/map-diff-ci/report/
          include-hidden-files: true
          retention-days: 30
      - name: Upload renderer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: station-map-diff-diagnostics
          path: .local/codex/map-diff-ci/report-work/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
