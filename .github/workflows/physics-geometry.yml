name: Physics geometry

on:
  pull_request:
    paths:
      - 'Resources/Prototypes/**'
      - 'Resources/Maps/**'
      - 'Tools/*physics_shapes.py'
      - '.github/workflows/physics-geometry.yml'
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s Tools -p test_physics_shapes.py
      - run: python Tools/check_physics_shapes.py
