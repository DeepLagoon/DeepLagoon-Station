name: Build & Run Shipyard Tests

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "Resources/SharedMaps/_Mono/Shuttles/**/*.yml" # Ship grids, Mono - set to mono files
      - "Resources/Prototypes/_Mono/Shipyard/**/*.yml" # Shipyard prototypes, Mono - set to mono files
      - "Content.IntegrationTests/Tests/_NF/ShipyardTests.cs" # Shipyard tests
      - "Resources/Prototypes/Entities/**/*.yml" # Mono Change, run when an entity may have changed price

jobs:
  build:
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - uses: ./.github/actions/prepare-engine

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.25.0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: TGUI/pnpm-lock.yaml
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /p:WarningsAsErrors=nullable /m

    - name: Run Shipyard Tests
      shell: pwsh
      run: |
        $env:DOTNET_gcServer=1
        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter FullyQualifiedName~ShipyardTest -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed
  ci-success:
    name: Build & Run Shipyard Tests
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
