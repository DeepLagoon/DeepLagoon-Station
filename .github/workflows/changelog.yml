name: PR Changelogs
on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      since:
        description: Optional UTC backlog start date
        required: false
concurrency:
  group: changelog-main
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: read
jobs:
  changelog:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      CHANGELOG_DIR: Resources/Changelog/Monolith.yml
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CHANGELOG_SINCE: ${{ inputs.since }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN || github.token }}
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test generator
        working-directory: Tools/changelog
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --test changelog.test.js
      - name: Generate and commit current main with bounded conflict recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DeepLagoon Changelog'
          git config user.email 'changelog@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node Tools/changelog/changelog.js
            git add -- "$CHANGELOG_DIR"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Automated changelog"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          echo 'Changelog push failed after five attempts' >&2
          exit 1
