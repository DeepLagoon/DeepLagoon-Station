name: Official client compatibility

on:
  pull_request:
  push:
    branches: [main, dev, staging, stable]

jobs:
  stock-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: TGUI/pnpm-lock.yaml
      - name: Fetch official engine release reference
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("ENGINE-COMPATIBILITY.json"))["official_engine_version"])')
          git -C RobustToolbox fetch --no-tags https://github.com/space-wizards/RobustToolbox.git "+refs/tags/v$VERSION:refs/tags/v$VERSION"
      - name: Validate approved server fork and source ownership
        run: |
          python3 Tools/test_engine_compatibility.py
          python3 Tools/check_engine_compatibility.py
      - name: Use official client release source for compatibility tests
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("ENGINE-COMPATIBILITY.json"))["official_engine_version"])')
          git -C RobustToolbox checkout --detach "refs/tags/v$VERSION"
          git -C RobustToolbox submodule update --init --recursive
      - name: Verify the official launcher-selected signed WebView reference
        run: |
          python3 -m pip install -r Tools/requirements-signed-webview.txt
          python3 Tools/prepare_signed_webview.py --output "$RUNNER_TEMP/signed-webview"
          echo "WebViewSignedReference=$RUNNER_TEMP/signed-webview/Robust.Client.WebView.dll" >> "$GITHUB_ENV"
      - name: Compile production content against stock engine
        run: dotnet build Content.Client/Content.Client.csproj -c Release /p:FullRelease=true /p:DeepLagoonStockValidation=true
      - name: Check JSON parser and stock sandbox contracts
        run: |
          dotnet build Content.Tests/Content.Tests.csproj -c Release /p:FullRelease=true /p:DeepLagoonStockValidation=true
          cp "$RUNNER_TEMP/signed-webview/Robust.Client.WebView.dll" "$RUNNER_TEMP/signed-webview/SpaceWizards.CefGlue.dll" bin/Content.Tests/
          dotnet test Content.Tests/Content.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~TguiActionDataTests|FullyQualifiedName~ClientSandboxTest.ClientModulesPassEngineTypeChecks'
