name: Repository CI contracts
on:
  pull_request:
  push:
    branches: [main, staging, stable]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r Tools/requirements-ci.txt
      - run: python -m unittest discover -s Tools -p 'test_ci_*.py' -v
