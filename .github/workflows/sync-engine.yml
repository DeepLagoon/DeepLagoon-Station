name: Sync DeepLagoon engine

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-engine.yml'
      - 'Tools/sync_engine.py'

concurrency:
  group: sync-deeplagoon-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'DeepLagoon/DeepLagoon-Station'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check whether the engine changed without cloning Station
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/DeepLagoon/DeepLagoon-Station/contents/RobustToolbox?ref=main',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'User-Agent': 'DeepLagoon-engine-sync'})
          with urllib.request.urlopen(request, timeout=30) as response:
              pinned = json.load(response)['sha']
          remote = subprocess.check_output(
              ['git', 'ls-remote', '--exit-code', 'https://github.com/DeepLagoon/RobustToolbox.git',
               'refs/heads/main'], text=True, timeout=60).split()[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(remote != pinned).lower() + '\n')
          PY
      - uses: actions/checkout@v4.2.2
        if: steps.probe.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          ref: main
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Test sync and compatibility checks
        if: steps.probe.outputs.changed == 'true' || github.event_name != 'schedule'
        run: python3 -m unittest discover -s Tools -p 'test*engine*.py' -q
      - name: Prepare latest compatible engine commit
        if: steps.probe.outputs.changed == 'true' || github.event_name != 'schedule'
        id: engine
        run: python3 Tools/sync_engine.py
      - uses: actions/setup-dotnet@v4.1.0
        if: steps.engine.outputs.changed == 'true'
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        if: steps.engine.outputs.changed == 'true'
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        if: steps.engine.outputs.changed == 'true'
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: TGUI/pnpm-lock.yaml
      - name: Verify official launcher-selected signed WebView
        if: steps.engine.outputs.changed == 'true'
        run: |
          python3 -m pip install -r Tools/requirements-signed-webview.txt
          python3 Tools/prepare_signed_webview.py --output "$RUNNER_TEMP/signed-webview"
          echo "WebViewSignedReference=$RUNNER_TEMP/signed-webview/Robust.Client.WebView.dll" >> "$GITHUB_ENV"
      - name: Build Release client and server with candidate engine
        if: steps.engine.outputs.changed == 'true'
        run: |
          dotnet build Content.Client/Content.Client.csproj -c Release /p:FullRelease=true
          dotnet build Content.Server/Content.Server.csproj -c Release /p:FullRelease=true
      - name: Validate content against official client source
        if: steps.engine.outputs.changed == 'true'
        env:
          ENGINE_VERSION: ${{ steps.engine.outputs.engine_version }}
        run: |
          git -C RobustToolbox checkout --detach "refs/tags/v$ENGINE_VERSION"
          git -C RobustToolbox submodule update --init --recursive
          dotnet build Content.Tests/Content.Tests.csproj -c Release /p:FullRelease=true /p:DeepLagoonStockValidation=true
          cp "$RUNNER_TEMP/signed-webview/Robust.Client.WebView.dll" "$RUNNER_TEMP/signed-webview/SpaceWizards.CefGlue.dll" bin/Content.Tests/
          dotnet test Content.Tests/Content.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~TguiActionDataTests|FullyQualifiedName~ClientSandboxTest.ClientModulesPassEngineTypeChecks'
      - name: Publish verified engine pointer
        if: steps.engine.outputs.changed == 'true'
        env:
          ENGINE_COMMIT: ${{ steps.engine.outputs.engine_commit }}
          ENGINE_VERSION: ${{ steps.engine.outputs.engine_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C RobustToolbox checkout --detach "$ENGINE_COMMIT"
          git -C RobustToolbox submodule update --init --recursive
          python3 Tools/check_engine_compatibility.py
          git add -- RobustToolbox
          test "$(git diff --cached --name-only)" = RobustToolbox
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update engine $ENGINE_VERSION to $ENGINE_COMMIT"
          # A concurrent Station push causes a safe rejection; the next run retries.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
