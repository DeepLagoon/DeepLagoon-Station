# DeepLagoon: единая настройка вики и справки.
# Скопируйте этот блок в серверный TOML (не создавайте второй [wiki], если он уже есть).
# Файл является примером и сам по себе не подключается к запущенному серверу.
# После установки обновлённого клиента/сервера дальнейшие назначения меняются здесь.
# Для применения файла перезапустите сервер с вашим конфигом.
# Реплицированные CVar читаются при следующем открытии справки; открытые окна нужно переоткрыть.
# Пустой wiki.routes сохраняет текущие назначения из wikiPage-прототипов.

[wiki]
origin = "https://wiki.deep-lagoon-ss14.ru"
tree_root = "/ru/guidebook/in_game"
tree_locale = "ru"
# 0 отключает автоматическое открытие для новичков.
new_player_minutes = 180.0

# Строка маршрута: источник = назначение. Комментарии — отдельными строками.
# Источники регистрозависимы, ID берутся из прототипов, а не из переведённых названий.
# Назначение: /путь, page:ID, guide:ID, local:GuideEntryID, external:https://адрес.
# page:ID и guide:ID — ссылки на другие строки, разрешается цепочка до 32 переходов.
# Пустое назначение отключает переход; циклы и неизвестные назначения не открываются.
# Встроенный просмотр разрешает только HTTPS wiki.origin, пути без query и страницы
# из маршрутов/дерева tree_root. external: открывает системный браузер.
# page:НовоеИмя = /ru/new_article также добавит кнопку НовоеИмя в окно справки.
# Приоритет для сущности: entity:точный_ID -> entity:родители -> guide:тема -> default.
# Привязка к базовому прототипу распространяется на потомков без собственного override.
# activation:ID отдельно переопределяет активацию объекта, включая обычные Paper-книги.
# Сам entity:ID добавляет контекстную справку; для GuideHelp-книг также меняет их активацию.
# Для профессий/рас/судов: точный источник -> guides из прототипа -> default.
# У судов без справки и компаний без URL перехода нет, пока он не задан здесь.
# Для обязательных правил пустое/невалидное назначение сохраняет локальные правила.
# Таймер, принятие правил и серверный учёт прочтения не меняются.
# Смена адреса статьи не сбрасывает уже сохранённое принятие правил.
