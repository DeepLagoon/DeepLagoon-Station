# Imported from Simple-Station/Einstein-Engines, master archive.
- type: entity
  parent: [ClothingNeckBase, BaseIntegratedMagboot]
  id: ClothingNeckMantleMag
  name: magmantle
  description: Invented by a dynamic duo of harpies, this mantle creates a localized
    gravity field, enabling the effects of magboots without the boot! However, the
    gravity field is cumbersome to move through, making the magnetic mantle somewhat
    inferior to its predecessor. However, it does come with a wool lining. Cozy!
  components:
  - type: Sprite
    sprite: _EE/Clothing/Neck/Mantles/magmantle.rsi
    layers:
    - state: icon
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Clothing
    sprite: _EE/Clothing/Neck/Mantles/magmantle.rsi
  - type: TemperatureProtection
    heatingCoefficient: 1.025
    coolingCoefficient: 0.8
  - type: ToggleClothing
    action: ActionToggleMagmantle
  - type: Magboots
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}
- type: entity
  id: ActionToggleMagmantle
  name: Toggle Magmantle
  description: Toggles the personal gravity field on and off.
  categories: [HideSpawnMenu]
  components:
  - type: InstantAction
    itemIconStyle: BigItem
    event: !type:ToggleActionEvent ''
