- type: entity
  name: antique pulse pistol
  parent: WeaponPulsePistol
  id: WeaponPulsePistolHoS
  description: One of the many weapons belonging to the Head of Security's private
    collection. This pistol is engraved with the words, "Forgive Us, Mother Sol'"
  components:
  - type: StealTarget
    stealGroup: [HoSAntiqueWeapon]
- type: entity
  name: CentCom disabler
  parent: WeaponDisabler
  id: WeaponCCDisabler
  description: An improved self-defense weapon that exhausts organic targets, weakening
    them until they collapse. Only for the finest officers that we don't trust with
    lethals.
  components:
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 20
  - type: StealTarget
    stealGroup: [NTRepWeapon]
  - type: Gun
    fireRate: 3
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/ccdisabler.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-0
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Tag
    tags:
    - HighRiskItem
    - Taser
    - Sidearm
- type: entity
  name: captain's pulse pistol
  parent: WeaponPulsePistol
  id: WeaponPulsePistolCaptain
  description: A rare and exotic handgun gifted to the station's Captain. Its ivory
    grip has been engraved with the words, "Glory to the Company, Glory to Mother
    Sol. Phoron will make us all rich."
  components:
  - type: StealTarget
    stealGroup: [WeaponCaptain]
