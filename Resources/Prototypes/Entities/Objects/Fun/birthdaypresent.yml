# A little way to say happy birthday on Frontier's anniversary.
- type: entity
  id: FrontierBirthdayGift
  name: birthday present
  description: A birthday present for Frontier Station. How sweet!
  parent: BaseItem
  suffix: Cake, Party Hat
  components:
  - type: Sprite
    sprite: _NF/Objects/Fun/birthdaypresent.rsi
    layers:
      - state: icon
  - type: SpawnItemsOnUse
    items:
      - id: FoodCakeBirthdaySlice
      - id: PaperFrontierBirthday
      - id: ClothingHeadHatPartyRed
        orGroup: Hat
      - id: ClothingHeadHatPartyBlue
        orGroup: Hat
      - id: ClothingHeadHatPartyYellow
        orGroup: Hat
      - id: ClothingHeadHatPartyGreen
        orGroup: Hat

- type: entity
  id: PaperFrontierBirthday
  name: Anniversary Notice
  categories: [ HideSpawnMenu ]
  suffix: "birthday"
  parent: Paper
  components:
  - type: Paper
    stampState: paper_stamp-centcom
    stampedBy:
    - stampedColor: '#006600FF'
      stampedName: Central Admiralty of Frontier
    content: "\\n                    [head=1]Уведомление о годовщине[/head]\\n\\n[head=3]Нам стало известно, что недавно исполнилась годовщина начала операций TSF в секторе Фронтира.\\n\\nВ честь праздника мы приложили бесплатный кусок торта и праздничный колпак.\\n\\nУделите немного времени празднованию. Спасибо, что помогаете делать Фронтир таким, какой он есть.[/head]\\n\\n                        [head=2]А теперь за работу.[/head]\\n"
