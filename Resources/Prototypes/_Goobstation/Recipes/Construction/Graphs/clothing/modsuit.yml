- type: constructionGraph
  id: Modsuit
  start: start
  graph:
  - node: start
    entity: ModsuitShell
    edges:
    - to: shell-core
      steps:
      - tag: ModsuitCore
        name: prototype-text-constructionGraph-Modsuit-name-ec64f3442b
        store: core-container
        completed:
        - !type:PlaySound
          sound: /Audio/Items/screwdriver2.ogg

  - node: shell-core
    actions:
    - !type:AppearanceChange
    edges:
    - to: start
      steps:
      - tool: Prying
        completed:
          - !type:EmptyContainer
            container: core-container
    - to: shell-core-secured
      steps:
      - tool: Screwing
        doAfter: 1

  - node: shell-core-secured
    actions:
    - !type:AppearanceChange
    edges:
    - to: shell-helmet
      steps:
      - tag: ModsuitHelmet
        name: prototype-text-constructionGraph-Modsuit-name-77fe00d52e
        doAfter: 1
        completed:
        - !type:PlaySound
          sound: /Audio/Items/screwdriver2.ogg

  - node: shell-helmet
    actions:
    - !type:AppearanceChange
    edges:
    - to: shell-chestplate
      steps:
      - tag: ModsuitChestplate
        name: prototype-text-constructionGraph-Modsuit-name-c64238b4df
        doAfter: 1
        completed:
        - !type:PlaySound
          sound: /Audio/Items/screwdriver2.ogg

  - node: shell-chestplate
    actions:
    - !type:AppearanceChange
    edges:
    - to: shell-gauntlets
      steps:
      - tag: ModsuitGauntlets
        name: prototype-text-constructionGraph-Modsuit-name-2553d79ee3
        doAfter: 1
        completed:
        - !type:PlaySound
          sound: /Audio/Items/screwdriver2.ogg

  - node: shell-gauntlets
    actions:
    - !type:AppearanceChange
    edges:
    - to: shell-boots
      steps:
      - tag: ModsuitBoots
        name: prototype-text-constructionGraph-Modsuit-name-5e6c705f7e
        doAfter: 1
        completed:
        - !type:PlaySound
          sound: /Audio/Items/screwdriver2.ogg

  - node: shell-boots
    actions:
    - !type:AppearanceChange
    edges:
    - to: shell-secured
      steps:
      - tool: Anchoring
        doAfter: 1

      - tool: Screwing
        doAfter: 1

  - node: shell-secured
    actions:
    - !type:AppearanceChange
    edges:
    - to: standard
      steps:
        - tag: ModsuitPlatingExternal
          name: prototype-text-constructionGraph-Modsuit-name-6631fd32b7
          doAfter: 1
          completed:
          - !type:PlaySound
            sound: /Audio/Items/screwdriver2.ogg

        - tool: Anchoring
          doAfter: 1

  - node: standard
    entity: ClothingModsuitStandard

  - node: security
    entity: ClothingModsuitSecurity

  - node: paramedic
    entity: ClothingModsuitParamedic

  - node: headofsecurity
    entity: ClothingModsuitHeadOfSecurity

  - node: engineer
    entity: ClothingModsuitEngineer

  - node: atmostech
    entity: ClothingModsuitAtmostech

  - node: rd
    entity: ClothingModsuitResearchDirector

  - node: captain
    entity: ClothingModsuitCaptain

# Mono
  - node: rogue
    entity: ClothingModsuitRogue

  - node: mercenary
    entity: ClothingModsuitMercenary