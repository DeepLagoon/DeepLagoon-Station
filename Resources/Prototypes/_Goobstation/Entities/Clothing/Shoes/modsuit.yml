# Mono - modsuits cleanup - see #3733
- type: entity
  abstract: true
  parent: ClothingShoesBase
  id: ClothingModsuitModuleBootsBase
  name: modsuit boots
  description: A special modular suit boots designed for compact folding inside modular suit control.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Goobstation/Clothing/Shoes/Modsuits/standard.rsi
    layers:
    - state: boots
    - state: boots-sealed
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ feet ]
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-boots
    sealDownPopup: sealable-clothing-seal-down-boots
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: ItemToggle
    onUse: false
    onActivate: false
  - type: ComponentToggler
    components:
    - type: NoSlip
  - type: Magboots
    enabledPrefix: null
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      shoes:
      - state: equipped-FEET-sealed

- type: entity
  abstract: true
  parent: ClothingModsuitModuleBootsBase
  id: ClothingModsuitBootsBase
  components:
  - type: ToggleClothing
    action: ActionToggleMagboots

- type: entity
  parent: ClothingModsuitModuleBootsBase
  id: ClothingModsuitBootsStandard
  name: standard modsuit boots
  description: A special modular suit boots designed for compact folding inside modular suit control.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeepLagoon/Clothing/Modsuits/standard.rsi
    layers:
    - state: boots
      map: [ "unsealed" ]
    - state: boots-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    sprite: _DeepLagoon/Clothing/Modsuits/standard.rsi
    clothingVisuals:
      shoes:
      - state: equipped-FEET
      shoes-vox:
      - state: equipped-FEET-anthro
      shoes-vulpkanin:
      - state: equipped-FEET-anthro
      shoes-hydrakin:
      - state: equipped-FEET-anthro
  - type: SealableClothingVisuals
    replaceBaseLayers: true
    clothingVisuals:
      shoes:
      - state: equipped-FEET-sealed
      shoes-vox:
      - state: equipped-FEET-sealed-anthro
      shoes-vulpkanin:
      - state: equipped-FEET-sealed-anthro
      shoes-hydrakin:
      - state: equipped-FEET-sealed-anthro

