# Mono - modsuits cleanup - see #3733

# BASE
- type: entity
  abstract: true
  parent: [ Clothing, ContentsExplosionResistanceBase ]
  id: ClothingModsuitBase
  name: modsuit hardsuit unit
  description: A special modular suit contol unit containing all necessary modular hardsuit parts.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Goobstation/Clothing/Back/Modsuits/standard.rsi
    layers:
    - state: control
    - state: control-sealed
      visible: false
      shader: unshaded
      map: [ "sealed" ]
  - type: Item
    size: Huge
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container
      cell_slot: !type:ContainerSlot
      core-container: !type:ContainerSlot
  - type: UserInterface
    interfaces:
      enum.ToggleClothingUiKey.Key:
        type: ToggleableClothingBoundUserInterface
      enum.ModUiKey.Key:
        type: ModBoundUserInterface
  - type: UseDelay
    delay: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: ToggleableClothing
    requiredSlot: back
    blockUnequipWhenAttached: true
    replaceCurrentClothing: true
  - type: WiresPanel
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        whitelist:
          components:
            - PowerCell
      core-container:
        name: mod-core-slot-name
        startingItem: ModsuitCoreStandard
        whitelist:
          tags:
          - ModsuitCore
  - type: ItemSlotsRequirePanel
    slots:
      cell_slot: true
      core-container: true
  - type: PowerCellDraw
    drawRate: 0.1 # Sealed draw rate
    useRate: 0.5 # Draw rate for sealing
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: false
  - type: DoAfter
  - type: SealableClothingControl
  - type: SealableClothingRequiresPower
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-sealed
  - type: ModControl
    capacity: 15
  - type: ModLink
  - type: PointLight
    enabled: false
    radius: 4
    energy: 2

- type: entity
  abstract: true
  parent: ClothingModsuitBase
  id: ClothingModsuitLegacyStorageBase
  components:
  - type: Storage
    # Duffel capacity while preserving the original satchel's outer item positions.
    grid:
    - 0,0,9,3
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      toggleable-clothing: !type:Container
      cell_slot: !type:ContainerSlot
      core-container: !type:ContainerSlot
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.ToggleClothingUiKey.Key:
        type: ToggleableClothingBoundUserInterface
      enum.ModUiKey.Key:
        type: ModBoundUserInterface

- type: entity
  parent: ClothingModsuitBase
  id: ClothingModsuitStandard
  name: standard modsuit hardsuit unit
  description: A special modular suit contol unit containing all necessary modular hardsuit parts.
  components:
  - type: Sprite
    sprite: _DeepLagoon/Clothing/Modsuits/standard.rsi
    layers:
    - state: control
      map: [ "unsealed" ]
    - state: control-sealed
      visible: false
      map: [ "sealed" ]
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingModsuitHelmetStandard
      gloves: ClothingModsuitGauntletsStandard
      outerClothing: ClothingModsuitChestplateStandard
      shoes: ClothingModsuitBootsStandard
  - type: Construction
    graph: Modsuit
    node: standard
  - type: Clothing
    sprite: _DeepLagoon/Clothing/Modsuits/standard.rsi
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
      back-resomi:
      - state: equipped-BACKPACK
  - type: SealableClothingVisuals
    replaceBaseLayers: true
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-sealed
      back-resomi:
      - state: equipped-BACKPACK-sealed
  - type: ModControl
    capacity: 15
    startingModules:
    - ModModuleStorage
    - ModModuleWelding
    - ModModuleFlashlight

- type: entity
  parent: ClothingModsuitStandard
  id: ClothingModsuitStandartPowerCell
  suffix: High-Capacity Battery
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        whitelist:
          components:
            - PowerCell
      core-container:
        name: mod-core-slot-name
        startingItem: ModsuitCoreStandard
        whitelist:
          tags:
          - ModsuitCore

