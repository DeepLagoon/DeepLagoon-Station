- type: entity
  id: PartModsuit
  parent: BaseItem
  name: MOD part
  description: A part used in MOD construction.
  abstract: true
  components:
  - type: Sprite
    sprite: _DeepLagoon/Clothing/Modsuits/construction.rsi
  - type: Icon
    sprite: _DeepLagoon/Clothing/Modsuits/construction.rsi
  - type: Item
    size: Normal
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  #- type: GuideHelp TODO: Guide

- type: entity
  id: ModsuitChestplate
  parent: PartModsuit
  name: MOD chestplate
  components:
  - type: Sprite
    state: chestplate
  - type: Icon
    state: chestplate
  - type: PhysicalComposition
    materialComposition:
      Steel: 62
  - type: Tag
    tags:
    - ModsuitPart
    - ModsuitChestplate

