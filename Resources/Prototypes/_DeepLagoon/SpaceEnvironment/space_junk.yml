# Space support keeps native wall anchoring and grid physics, without a walkable room floor.
- type: tile
  id: DeepLagoonSpaceJunkSupport
  name: tiles-space
  isSpace: true
  isSubfloor: true
  sturdy: false
  transparent: true
  heatCapacity: 10000
  mass: 10

- type: entity
  id: DeepLagoonSpaceDustProjectile
  name: space dust particle
  categories: [ HideSpawnMenu ]
  components:
  - type: SpaceDustProjectile
  - type: Sprite
    noRot: false
    scale: 0.25, 0.25
    sprite: _Mono/Objects/SpaceArtillery/50_armorpiercing_machinegun_casing.rsi
    layers:
    - state: base-projectile
      shader: unshaded
      color: "#a6dcff"
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeCircle
          radius: 0.05
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Projectile
    damage:
      types:
        Blunt: 1
  - type: Tracer
    length: 1.25
    lifetime: 2.5
    color: "#96d2ff99"
  - type: TimedDespawn
    lifetime: 2.5

# A small subset of the native blue NFBaseWreckDebris loot. Maximum two table results per pile.
- type: entityTable
  id: DeepLagoonSpaceJunkLoot
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: SalvageScrapLowValue
      weight: 75
    - !type:NestedSelector
      tableId: SalvageEquipmentCommon
      weight: 20
    - !type:NestedSelector
      tableId: SalvageTreasureCommon
      weight: 5

- type: entityTable
  id: DeepLagoonSpaceJunkFieldLoot
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: SalvageScrapHighValue
      weight: 45
    - !type:NestedSelector
      tableId: SalvageEquipmentUncommon
      weight: 35
    - !type:NestedSelector
      tableId: SalvageTreasureUncommon
      weight: 20

# Asteroid-stream junk favors single artifact fragments within the existing loot budget.
- type: entityTable
  id: DeepLagoonSpaceJunkAsteroidLoot
  table: !type:GroupSelector
    children:
    - id: ArtifactFragment1
      weight: 25
    - !type:NestedSelector
      tableId: DeepLagoonSpaceJunkFieldLoot
      weight: 75
