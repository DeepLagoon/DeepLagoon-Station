- type: apartmentFurniture
  id: DLAptTrash
  name: dl-apartment-trash
  entity: DLApartmentTrashBin
  price: 35
  legacyFree: true
  category: Оборудование
  maxCount: 2

- type: entity
  id: DLApartmentTrashBin
  parent: BaseStructure
  name: apartment trash bin
  description: Items left inside are deleted at the end of the round. You can retrieve them before then.
  components:
  - type: ApartmentTrash
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Storage/Crates/trashcart.rsi
    layers:
    - state: base
    - state: closed
  - type: Storage
    grid:
    - 0,0,9,9
    maxItemSize: Ginormous
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: InteractionOutline
  - type: NoDeconstruct

- type: apartmentFurniture
  id: DLAptAtmosphere
  name: dl-apartment-atmosphere-title
  entity: DLApartmentAtmosphereController
  price: 300
  legacyFree: true
  category: Оборудование
  maxCount: 1
  blocksMovement: false
  allowsOverlap: true

- type: entity
  id: DLApartmentAtmosphereController
  parent: BaseStructure
  name: apartment atmosphere controller
  description: Maintains the apartment's pressure and oxygen-nitrogen ratio, removing all other gases. Works only in apartments.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Specific/Atmospherics/sensor.rsi
    state: gsensor1
    drawdepth: FloorObjects
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures: {}
  - type: ApartmentAtmosphere
  - type: ActivatableUI
    key: enum.ApartmentAtmosphereUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ApartmentAtmosphereUiKey.Key:
        type: ApartmentAtmosphereBoundUserInterface
  - type: NoDeconstruct

