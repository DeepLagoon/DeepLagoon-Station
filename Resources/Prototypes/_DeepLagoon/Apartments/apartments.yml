# Curated home variants retain useful interactions without construction, salvage or healing.
- type: entity
  id: DLApartmentBusStop
  parent: DefaultStationBeaconService
  name: residential bus stop
  description: Residential route return point. Place on the CentCom grid with a public transit dock.
  components:
  - type: ApartmentTransitStop
  - type: NavMapBeacon
    defaultText: dl-apartment-residential-stop

- type: entity
  id: DLAptSofaEntity
  parent: BenchSofaMiddle
  categories: [HideSpawnMenu]
  components:
  - type: Transform
    anchored: true

- type: entity
  id: DLAptChairEntity
  parent: ChairWood
  categories: [HideSpawnMenu]
  components:
  - type: Transform
    anchored: true

- type: entity
  id: DLAptTableEntity
  parent: TableWood
  categories: [HideSpawnMenu]

- type: entity
  id: DLAptBedEntity
  parent: Bed
  categories: [HideSpawnMenu]
  components:
  - type: HealOnBuckle
    damage: {}

- type: entity
  id: DLAptPlantEntity
  parent: PottedPlant1
  categories: [HideSpawnMenu]
  components:
  - type: Transform
    anchored: true

- type: entity
  id: DLApartmentTerminal
  parent: BaseStructureComputer
  name: apartment terminal
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - state: computer
    - state: generic
  - type: ApartmentTerminal

- type: entity
  id: DLApartmentElevatorPanel
  parent: BaseStructure
  name: apartment elevator panel
  description: Select an apartment number. Everyone inside the cabin travels together.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _DeepLagoon/Structures/apartment_elevator.rsi
    state: panel
    drawdepth: WallMountedItems
  - type: InteractionOutline
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
  - type: ApartmentElevator
    cabinMin: "-1,-3"
    cabinMax: "1,-1"
    doorOffsets: ["0,-4"]
    travelTime: 12
    travelSound: !type:SoundPathSpecifier
      path: /Audio/_DeepLagoon/Apartments/travel.ogg
    arrivalSound: !type:SoundPathSpecifier
      path: /Audio/_DeepLagoon/Apartments/arrival.ogg
  - type: NoDeconstruct

# Cosmetic mist only: no reagents, gas, spreading, or inhalation damage.
- type: entity
  id: DLApartmentElevatorMist
  name: elevator mist
  categories: [HideSpawnMenu]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke
    drawdepth: Effects
  - type: TimedDespawn
    lifetime: 2

- type: apartmentTemplate
  id: DLApartmentBasic
  price: 0
  name: dl-apartment-basic
  version: 1
  map: /Maps/_DeepLagoon/Apartments/apartments_basic.yml
  width: 11
  height: 16
  arrival: "4,8"
  maxFurniture: 20
  maxVisitors: 4
  reservedCells: ["3,12", "4,12", "5,12", "3,13", "4,13", "5,13", "3,14", "4,14", "5,14", "4,10", "4,11"]
  catalog: [DLAptSofa, DLAptChair, DLAptTable, DLAptBed, DLAptPlant]
  furniture: []
