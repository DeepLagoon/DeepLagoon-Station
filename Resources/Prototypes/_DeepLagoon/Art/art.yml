- type: entity
  parent: BaseItem
  id: DLArtCanvas
  name: painting canvas
  description: A blank canvas. Use a brush or crayon to paint it and save it to the library from the canvas editor.
  components:
  - type: Sprite
    sprite: _DeepLagoon/Art/supplies.rsi
    layers:
    - state: canvas
    - state: canvas
      map: [art-image]
      visible: false
  - type: Item
    size: Normal
  - type: ArtCanvas
  - type: ArtDisplay
    drawingSize: 23, 23
  - type: UserInterface
    interfaces:
      enum.ArtUiKey.Key:
        type: ArtEditorBoundUserInterface
  - type: StaticPrice
    price: 25

- type: entity
  parent: DLArtCanvas
  id: DLArtDurableCanvas
  name: durable painting canvas
  description: A durable canvas for a private apartment painting frame. Its painting and layers are kept between rounds while it is in your apartment.
  components:
  - type: ArtDurableCanvas

- type: entity
  parent: DLArtFrameItem
  id: DLApartmentPaintingFrameItem
  name: apartment painting frame
  description: Use it on a wall in your own apartment, then insert a durable painting canvas. Ordinary canvases do not fit.
  components:
  - type: ApartmentPaintingFrame
  - type: Construction
    graph: DLArtFrame
    node: apartmentFrame

- type: entity
  parent: DLArtFrame
  id: DLApartmentPaintingFrame
  name: apartment painting frame
  description: A private frame for a durable canvas. The painting is saved with the apartment between rounds.
  components:
  - type: ApartmentPaintingFrame

- type: entity
  parent: BaseItem
  id: DLArtBrush
  name: paintbrush
  description: A brush for painting on a canvas.
  components:
  - type: Sprite
    sprite: _DeepLagoon/Art/supplies.rsi
    state: brush
  - type: Item
    size: Small
  - type: ArtTool
    kind: brush
  - type: StaticPrice
    price: 15

- type: entity
  parent: BaseItem
  id: DLArtSprayCan
  name: artist's spray can
  description: A spray can for painting on a canvas.
  components:
  - type: Sprite
    sprite: Objects/Fun/spraycans.rsi
    layers:
    - state: spray
    - state: spray_colors
      color: "#777777"
  - type: Item
    size: Small
  - type: ArtTool
    kind: spray
    color: "#777777"
  - type: StaticPrice
    price: 20

# Craft an item first, then use the held frame on a wall.
- type: entity
  parent: BaseItem
  id: DLArtFrameItem
  name: wooden painting frame
  description: A handmade wooden frame. Attach it to a wall before inserting a canvas.
  components:
  - type: Sprite
    sprite: _DeepLagoon/Art/supplies.rsi
    state: frame
  - type: Item
    size: Normal
  - type: ArtFrameItem
  - type: Construction
    graph: DLArtFrame
    node: frame

- type: entity
  parent: BaseSign
  id: DLArtFrame
  name: wooden painting frame
  description: An empty wall frame for displaying a saved painting.
  components:
  - type: Sprite
    sprite: _DeepLagoon/Art/supplies.rsi
    layers:
    - state: frame
    - state: canvas
      map: [art-image]
      visible: false
    - state: frame
  - type: ArtFrame
  - type: Transform
    anchored: true
  - type: ArtDisplay
    drawingSize: 23, 23
  - type: WallMount
    arc: 360
  - type: ContainerContainer
    containers:
      art-canvas: !type:ContainerSlot

# Mappers explicitly place these instead of changing existing decorative paintings.
- type: entity
  parent: DLArtFrame
  id: DLArtGalleryFrame
  suffix: Persistent gallery
  components:
  - type: ArtFrame
    fillOnRoundStart: true

- type: constructionGraph
  id: DLArtFrame
  start: start
  graph:
  - node: start
    edges:
    - to: frame
      steps:
      - material: WoodPlank
        amount: 2
        doAfter: 2
  - node: frame
    entity: DLArtFrameItem
  # No crafting edge: apartment frames are purchased in the apartment shop.
  - node: apartmentFrame
    entity: DLApartmentPaintingFrameItem

- type: construction
  id: DLArtFrameItem
  name: construction-name-dl-art-frame
  description: construction-desc-dl-art-frame
  graph: DLArtFrame
  startNode: start
  targetNode: frame
  category: construction-category-furniture
  icon:
    sprite: _DeepLagoon/Art/supplies.rsi
    state: frame
  objectType: Item

