- type: entity
  parent: BaseItem
  id: DLLustWishPortalKit
  name: "Lustwish Portal Bore"
  description: "A device utilizing bluespace technology to transpose portions of people from one space to another."
  components:
  - type: LustWishPortalKit
  - type: Sprite
    sprite: _DeepLagoon/LustWish/Portal.rsi
    state: device
  - type: Item
    size: Normal
  - type: StaticPrice
    price: 100
- type: entity
  parent: BaseStructure
  id: DLLustWishPortal
  name: "LustWish Portal"
  description: "A portal that people can partially fit through."
  components:
  - type: LustWishPortal
  - type: Strap
    position: Stand
    rotation: 0
    size: 100
  - type: Eye
  - type: Sprite
    sprite: _DeepLagoon/LustWish/Portal.rsi
    state: portal
    noRot: true
  - type: Transform
    anchored: false
  - type: Physics
    canCollide: false
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction

- type: entity
  parent: BaseStructure
  id: DLLustWishPortalProjection
  name: LustWish Portal
  description: A portal that people can partially fit through.
  components:
  - type: LustWishProjection
  - type: Sprite
    sprite: _DeepLagoon/LustWish/Portal.rsi
    state: portal
    visible: false
    noRot: true
  - type: Transform
    anchored: false
  - type: Physics
    canCollide: false
