      shader: unshaded
  - type: Item
    heldPrefix: pdv
  - type: ShipyardVoucher
    destroyOnEmpty: false
    cooldown: 5400
    consoleType: BlackMarket
    companyName: PDV
    vessels:
    - Vulture

- type: listing
  id: UplinkPdvBastionVoucher
  productEntity: ShipVoucherPdvBastion
  cost:
    Doubloon: 200
  categories:
  - UplinkPdvVouchers
  conditions:
  - !type:StoreWhitelistCondition
