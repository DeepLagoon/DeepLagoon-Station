- type: entity
  parent: BaseShipLPCRenewable
  id: ShipVoucherPdvBastion
  name: PDV Bastion LPC [T2]
  description: A small card that contains the data for the procurement of a Bastion-class brawler from the Dynasty's reserves.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon
    - state: screen
      color: "#1eff00"
    - state: screen7
      color: "#1eff00"
      shader: unshaded
  - type: Item
    heldPrefix: pdv
  - type: ShipyardVoucher
    destroyOnEmpty: false
    cooldown: 3600
    consoleType: BlackMarket
    companyName: PDV
    vessels:
    - Bastion

- type: entity
  parent: BaseShipLPCRenewable
  id: ShipVoucherPdvVulture
  name: PDV Vulture LPC [T3]
  description: A small card that contains the data for the procurement of a Vulture-class heavy salvage ship from the Dynasty's reserves.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_capital
    - state: screen
      color: "#1eff00"
    - state: screen4
