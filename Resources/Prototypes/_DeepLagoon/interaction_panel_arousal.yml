# Максимум задаётся физиологией персонажа: толерантность * 3.
# healthMultiplier/fallbackHealth/recoveryDuration сохранены для старых внешних каталогов; цикл BlueMoon использует физиологию.
- type: interactionPanelArousal
  id: InteractionPanelArousal
  healthMultiplier: 1
  fallbackHealth: 100
  decayPerSecond: 1
  recoveryDuration: 10
  resetMessage: dl-interaction-panel-arousal-reset
  chatColor: "#E8A0CF"
  vignetteColor: "#B84B93"
  vignetteMaxAlpha: 0.65
  # Списки ID из interaction_panel_sounds.yml. Пусто = без звука.
  # Один ID = один звук, несколько = случайный выбор при каждом сбросе.
  maleSounds: [final_m1, final_m2, final_m3]
  femaleSounds: [final_f1, final_f2, final_f3]
  unsexedSounds: [final_f1, final_f2, final_f3]
  unknownSounds: [final_f1, final_f2, final_f3]
