# Вместо path можно задать paths: [/Audio/...ogg, /Audio/...ogg].
# Один файл выбирается случайно. Такой набор доступен и пользовательским действиям.
# volume — громкость в дБ: 0 исходная, -5 тише; допустимый диапазон -40…6.
# Добавьте новую запись с уникальным id и существующим .ogg. Пути выбирает сервер.
# category — ключ локализации категории в выпадающем списке, name — название звука.
- type: interactionPanelSound
  id: clap
  name: dl-interaction-panel-sound-clap
  category: dl-interaction-panel-sounds-gestures
  path: /Audio/Effects/Emotes/clap-single.ogg
  volume: -5

