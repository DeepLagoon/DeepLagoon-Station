# Concrete bases for source-authored map clothing. The importer supplies WhiteMoon art.
# The hidden bases have a valid fallback icon; every mapped child overrides its ground and worn art.

- type: entity
  id: BitrunImportedClothingEyesBase
  parent: ClothingEyesBase
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _DeepLagoon/Bitrunning/bitrunner_uniform.rsi
    state: bitrunner

