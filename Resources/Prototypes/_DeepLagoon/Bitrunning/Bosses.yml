- type: damageModifierSet
  id: BitrunColossusDamage
  coefficients:
    Blunt: 1
    Slash: 1
    Piercing: 1
    Heat: 0.5
    Cold: 0.5
    Shock: 0.5
    Poison: 1
    Asphyxiation: 1

- type: entity
  id: BitrunMobBossBase
  abstract: true
  parent: BaseMobAsteroid
  categories: [ HideSpawnMenu ]
  components:
  - type: BitrunMegafauna
  - type: DamageArmorOverride
    sourceArmorPenetration: true
  - type: Tag
    tags: [BitrunCrusherMarkable]
  - type: Destructible
    thresholds: [] # Source megafauna do not inherit the humanoid 400-blunt gib threshold.
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        8
      AggroVisionRadius: !type:Single
        14
  - type: DamageStateVisuals
  - type: NoSlip
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 16
        Structural: 20

- type: entity
  id: BitrunMobRangedBossBase
  abstract: true
  parent: BitrunMobBossBase
  components:
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 200
  - type: Gun
    useKey: false
    showExamineText: false
    soundEmpty: null

- type: entity
  id: BitrunMobAshDrake
  name: ash drake
  description: Guardians of the necropolis.
  parent: [BitrunMobBossBase, FlyingMobBase]
  components:
  - type: BitrunDrake
  - type: Damageable
    damageModifierSet: BitrunColossusDamage
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: MeleeWeapon
    armorPenetration: 0.4
    attackRate: 1
    damage:
      types:
        Blunt: 40
        Slash: 0
        Structural: 400
  - type: BitrunMegafauna
    deleteOnDeath: false
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeepLagoon/Bitrunning/ash_drake.rsi
    offset: 0, 1
    noRot: true
    layers:
    - state: dragon
      map: [ "enum.DamageStateVisualLayers.Base", drake ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BitrunEquipmentVisuals.Mode:
        drake:
          ground: {state: dragon, color: '#FFFFFF'}
          shadow: {state: dragon_shadow, color: '#FFFFFF'}
          escape: {state: dragon, color: '#FFFF00'}
          dead: {state: dragon_dead, color: '#FFFFFF'}
  - type: DamageStateVisuals
    states:
      Alive:
        Base: dragon
      Dead:
        Base: dragon_dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 100
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      1250: Dead
  - type: Temperature
    heatDamageThreshold: 800

- type: entity
  id: BitrunMobColossus
  name: colossus
  description: A monstrous creature protected by heavy shielding.
  parent: BitrunMobRangedBossBase
  components:
  - type: BitrunColossus
  - type: MeleeWeapon
    armorPenetration: 0.4
    damage:
      types:
        Blunt: 40
        Structural: 400
  - type: Damageable
    damageModifierSet: BitrunColossusDamage
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeepLagoon/Bitrunning/colossus.rsi
    offset: 0, 1
    noRot: true
    state: eva
  - type: MobThresholds
    thresholds:
      0: Alive
      1250: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.6
    baseSprintSpeed: 2
  - type: ProjectileBatteryAmmoProvider
    proto: BitrunColossusVolley
    fireCost: 100
  - type: Gun
    fireRate: 0.5
    selectedMode: Burst
    availableModes:
    - Burst
    burstCooldown: 5
    burstFireRate: 4
    shotsPerBurst: 3
    projectileSpeed: 8
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg

- type: entity
  id: BitrunColossusBolt
  parent: BulletLaser
  name: death bolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeepLagoon/Bitrunning/boss_projectile.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Projectile
    armorPenetration: 1
    damage:
      types:
        Blunt: 25

- type: entity
  id: BitrunColossusVolley
  parent: BitrunColossusBolt
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: BitrunColossusBolt
    count: 3
    spread: 32

- type: entity
  id: BitrunMobBubblegum
  name: Bubblegum
  description: In what passes for a hierarchy among slaughter demons, this one is king.
  parent: BitrunMobBossBase
  components:
  - type: BitrunBubblegum
  - type: Damageable
    damageModifierSet: BitrunColossusDamage
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeepLagoon/Bitrunning/bubblegum.rsi
    offset: 0, 1
    noRot: true
    layers:
    - state: bubblegum
      map: ["enum.DamageStateVisualLayers.Base", bubblegum]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BitrunEquipmentVisuals.Mode:
        bubblegum:
          ground: {color: '#FFFFFF'}
          enraged: {color: '#FF3232'}
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bubblegum
      Dead:
        Base: bubblegum
  - type: MobThresholds
    thresholds:
      0: Alive
      1250: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: MeleeWeapon
    armorPenetration: 0.4
    attackRate: 0.5
    damage:
      types:
        Blunt: 40
        Slash: 0
        Structural: 400

- type: entity
  id: BitrunMobHierophant
  name: hierophant
  description: A massive metal club that hangs in the air as though waiting. It'll make you dance to its beat.
  parent: [BitrunMobBossBase, FlyingMobBase]
  components:
  - type: BitrunHierophant
  - type: Damageable
    damageModifierSet: BitrunColossusDamage
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeepLagoon/Bitrunning/hierophant.rsi
    offset: 0, 0.5
    noRot: true
    layers:
    - state: hierophant
      map: [hierophant]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BitrunEquipmentVisuals.Mode:
        hierophant:
          ground: {color: '#FFFFFF'}
          blink: {color: '#FFFFFF20'}
  - type: MobThresholds
    thresholds:
      0: Alive
      1250: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Blunt: 0
        Slash: 0
        Structural: 400

- type: entity
  id: BitrunMobWendigo
  name: wendigo
  description: A mythological man-eating legendary creature, the sockets of its eyes track you with an unsatiated hunger.
  parent: BitrunMobRangedBossBase
  components:
  - type: BitrunWendigo
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Damageable
    damageModifierSet: BitrunColossusDamage
  - type: BitrunMegafauna
    deleteOnDeath: false
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeepLagoon/Bitrunning/wendigo.rsi
    offset: 0, 0.5
    noRot: true
    layers:
    - state: wendigo
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: DamageStateVisuals
    states:
      Alive:
        Base: wendigo
      Dead:
        Base: wendigo_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      1250: Dead
  - type: MeleeWeapon
    armorPenetration: 0.4
    damage:
      types:
        Blunt: 40
        Structural: 400
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.6
    baseSprintSpeed: 4.5
  - type: ProjectileBatteryAmmoProvider
    proto: BitrunWendigoBolt
    fireCost: 100
  - type: Gun
    fireRate: 0.7
    projectileSpeed: 9
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser2.ogg

- type: entity
  id: BitrunWendigoBolt
  parent: BitrunColossusBolt
  name: wendigo shockwave
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeepLagoon/Bitrunning/boss_projectile.rsi
    layers:
    - state: chronobolt
      shader: unshaded
      color: "#9be9ff"
  - type: Projectile
    damage:
      types:
        Blunt: 25

- type: entity
  id: BitrunWendigoSpiral
  parent: BitrunWendigoBolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 15

- type: entity
  id: BitrunMobBloodDrunkMiner
  name: blood-drunk miner
  description: A miner destined to wander forever, engaged in an endless hunt.
  parent: BitrunMobRangedBossBase
  components:
  - type: BitrunMiner
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        source-saw:
          True: { state: miner_transformed }
          False: { state: miner }
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeepLagoon/Bitrunning/blood_drunk_miner.rsi
    offset: 0, 0.5
    noRot: true
    layers:
    - state: miner
      map: [ source-saw ]
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.2
    baseSprintSpeed: 4
  - type: MeleeWeapon
    animation: WeaponArcSlash
    attackRate: 2.5
    damage:
      types:
        Slash: 6
        Structural: 400
  - type: ProjectileBatteryAmmoProvider
    proto: BitrunMinerKineticBolt
    fireCost: 100
  - type: Gun
    fireRate: 0.625
    projectileSpeed: 11
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg

- type: entity
  id: BitrunMinerKineticBolt
  parent: BulletKinetic
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 20
  - type: BitrunProjectileRange
    range: 4
    speed: 11
    kinetic: true
