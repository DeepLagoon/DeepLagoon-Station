  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeepLagoon/Bitrunning/wendigo.rsi
    offset: 0, 0.5
    noRot: true
    layers:
    - state: wendigo
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: DamageStateVisuals
    states:
      Alive:
        Base: wendigo
      Dead:
        Base: wendigo_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      330: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.6
    baseSprintSpeed: 4.5
  - type: ProjectileBatteryAmmoProvider
    proto: BitrunWendigoBolt
    fireCost: 100
  - type: Gun
    fireRate: 0.7
    projectileSpeed: 9
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser2.ogg

- type: entity
  id: BitrunWendigoBolt
  parent: WatcherBolt
  name: freezing bolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _DeepLagoon/Bitrunning/boss_projectile.rsi
    layers:
    - state: chronobolt
      shader: unshaded
      color: "#9be9ff"
  - type: Projectile
    damage:
      types:
        Cold: 12

- type: entity
  id: BitrunMobBloodDrunkMiner
  name: blood-drunk miner
  description: A miner still carrying an accelerator and a blade for the endless hunt.
  parent: BitrunMobRangedBossBase
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _DeepLagoon/Bitrunning/blood_drunk_miner.rsi
    offset: 0, 0.5
    noRot: true
    state: miner
  - type: MobThresholds
    thresholds:
      0: Alive
      280: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.2
    baseSprintSpeed: 4
  - type: MeleeWeapon
    animation: WeaponArcSlash
    attackRate: 1.75
    damage:
      types:
        Slash: 16
        Structural: 20
  - type: ProjectileBatteryAmmoProvider
    proto: BulletKinetic
    fireCost: 100
  - type: Gun
    fireRate: 0.65
    projectileSpeed: 15
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
