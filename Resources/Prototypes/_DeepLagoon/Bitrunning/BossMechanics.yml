    drawdepth: FloorObjects

- type: entity
  id: BitrunBubblegumHallucination
  name: Bubblegum's hallucination
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _DeepLagoon/Bitrunning/bubblegum.rsi
    state: bubblegum
    offset: 0, 1
    color: '#FFFFFF80'
    noRot: true
    drawdepth: Mobs

- type: entity
  id: BitrunBubblegumLanding
  parent: BitrunDrakeLanding
