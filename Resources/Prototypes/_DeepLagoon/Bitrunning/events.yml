# WhiteMoon's bitrunning_glitch has max_occurrences = 0. It is available to
# administrators; automatic domain glitches use the quantum server's threat.
- type: entity
  parent: BaseGameRule
  id: BitrunGlitchEvent
  name: Bitrunning glitch
  components:
  - type: StationEvent
    weight: 100
    minimumPlayers: 1
    maxOccurrences: 0
    earliestStart: 0
  - type: BitrunGlitchRule

- type: entity
  parent: BitrunGlitchEvent
  id: BitrunCyberPoliceEvent
  name: Bitrunning cyber police
  components:
  - type: BitrunGlitchRule
    forcedRole: BitrunGhostCyberPolice

- type: entity
  parent: BitrunGlitchEvent
  id: BitrunCyberTacEvent
  name: Bitrunning cyber tactical officer
  components:
  - type: BitrunGlitchRule
    forcedRole: BitrunGhostCyberTac

- type: entity
  parent: BitrunGlitchEvent
  id: BitrunNetguardianEvent
  name: Bitrunning netguardian
  components:
  - type: BitrunGlitchRule
    forcedRole: BitrunGhostNetguardian
