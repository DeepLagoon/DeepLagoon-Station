- type: entity
  id: ActionAriralLayEgg
  name: lay egg
  description: Lay a single egg.
  components:
  - type: InstantAction
    icon: { sprite: Objects/Consumable/Food/egg.rsi, state: icon }
    charges: 1
    event: !type:EggAriralLayInstantActionEvent

- type: entity
  parent: FoodEgg
  id: FoodAriralEggLaid
  name: strange egg
  description: An ariral egg containing toxic blood.
  components:
  - type: Sprite
    scale: 1.3, 1.4
    sprite: Objects/Consumable/Food/egg.rsi
  - type: BadFood
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Egg
          Quantity: 6
        - ReagentId: AriralBlood
          Quantity: 6
