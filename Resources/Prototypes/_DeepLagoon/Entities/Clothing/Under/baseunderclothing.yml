# Underwear bases ported from Corvax-Wega.
# Wega-specific parts (ToolRefinable/MaterialCloth1, Edible/SolutionFood, BaseSlicingRefinable)
# are omitted; only wearables with their sprite/inv behavior are kept.

- type: entity
  parent: Clothing
  id: ClothingUnderBottomBase
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Clothing
    equipDelay: 2
    unequipDelay: 2
    quickEquip: false
    slots:
    - underwearbottom
  - type: Item
    size: Small
  - type: Storage
    grid:
    - 0,0,0,1
    maxItemSize: Tiny
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: UseDelay
    delay: 0.5

- type: entity
  parent: Clothing
  id: ClothingUnderSocksBase
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: false
    slots:
    - socks

- type: entity
  parent: Clothing
  id: ClothingUnderTopBase
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: Item
    size: Small
  - type: Clothing
    equipSound: /Audio/Items/jumpsuit_equip.ogg
    equipDelay: 2
    unequipDelay: 2
    quickEquip: false
    slots:
    - underweartop
