- type: entity
  parent: SeedBase
  name: packet of bloonion seeds
  id: BloonionSeeds
  components:
    - type: Seed
      plantId: BloonionPlants
    - type: Sprite
      sprite: Objects/Specific/Hydroponics/bloonion.rsi

- type: entity
  name: bloonion bulb
  description: A strange floating bulb.. Nothing worth crying over.
  parent: [BaseStructureDynamic, ProduceBase]
  id: FoodBloonion
  components:
  - type: Appearance
  - type: Sprite
    drawdepth: Items
    noRot: true
    sprite: Objects/Specific/Hydroponics/bloonion.rsi
    state: produce
  - type: Item
    sprite: Objects/Specific/Hydroponics/bloonion.rsi
    heldPrefix: produce
  - type: Produce
    plantId: BloonionPlants
  - type: Tag
    tags:
    - Vegetable
  - type: PotencyVisuals
  - type: FlavorProfile
    flavors:
    - onion
    - strange
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 100
        reagents:
        - ReagentId: Potassium
          Quantity: 1
        - ReagentId: Phosphorus
          Quantity: 1
        - ReagentId: Sugar
          Quantity: 3
        - ReagentId: Vitamin
          Quantity: 5
        - ReagentId: Allicin
          Quantity: 5
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 0.001
    intensitySlope: 1
    totalIntensity: 0.1
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:SpillBehavior
        solution: food
      - !type:TriggerBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.20
          position: 0, 0.35
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
