# Additional DeepLagoon crops migrated to the upstream plant entity model.
- type: entity
  parent: BasePlant
  id: DeepLagoonSpesosPlant
  name: seeds-spesos-display-name
  categories:
  - HideSpawnMenu
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/spesostree.rsi
  - type: PlantData
    name: seeds-spesos-name
    noun: seeds-noun-seeds
    packetPrototype: SpesosTreeSeeds
    productPrototypes:
    - SpaceCash
    mutationPrototypes: []
  - type: Plant
    lifespan: 45
    maturation: 15
    production: 8
    yield: 3
    potency: 10
    growthStages: 2
  - type: PlantGrowth
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantWeedPest
  - type: PlantToxins
  - type: PlantAtmospheric
    lowHeatTolerance: 283
    highHeatTolerance: 303
    lowPressureTolerance: 81
    highPressureTolerance: 121
  - type: PlantConsumeExudeGas
    consumeGasses: {}
    exudeGasses: {}
  - type: PlantChemicals
    chemicals: {}
