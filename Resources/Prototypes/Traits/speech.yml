# Free

- type: trait
  id: Accentless
  requirements:
  - kind: Group
    groupName: trait-group-accents
    max: 1
    values:
    - Accentless
    - SouthernAccent
    - PirateAccent
    - CowboyAccent
    - GermanAccent
    - ItalianAccent
    - FrenchAccent
    - SpanishAccent
    - Liar
    - RussianAccent
    - SocialAnxiety
    - FrontalLisp
    - BoganAccent
    - ScottishAccent
    - StreetpunkAccent
    - GoblinAccent
    - Accentless
  points: 0
  slots: 1
  name: trait-accentless-name
  description: trait-accentless-desc
  category: SpeechTraits
  cost: 2
  components:
  - type: Accentless
    removes:
    - type: GoblinAccent # Frontier
    - type: LizardAccent
    - type: MothAccent
    - type: ReplacementAccent
      accent: dwarf

