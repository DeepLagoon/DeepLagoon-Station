- type: entity
  id: PaperMailNTSoapAd1
  categories: [ HideSpawnMenu ]
  suffix: "soap ad 1"
  parent: Paper
  components:
  - type: Paper
    stampedBy:
    - stampedColor: '#333333FF'
      stampedName: Christopher Cleanman
      stampType: Signature
    content: "[head=3]Здравствуйте, уважаемый покупатель![/head]\\nВас выбрали для получения бесплатного пробного набора ароматного мыла от Nanotrasen.\\n\\nПочему бы не принять приятный тёплый душ с нашим ароматным мылом? Проверено: эффективно против грязи из вентиляции и плесени.\\n\\nНадеемся, вам понравится.\\n\\nС уважением,\\n      Джон Уборщик, совице-президент TSF-NT Habs, отдел туалетных принадлежностей.\\n"
- type: entity
  id: PaperMailNTSoapAd2
  categories: [ HideSpawnMenu ]
  suffix: "soap ad 2"
  parent: Paper
  components:
  - type: Paper
    content: "[head=2]ПРИВЕТСТВУЕМ, ГРАЖДАНИН ФРОНТИРА[/head]\\n\\nСОГЛАСНО НАШИМ ОТЧЁТАМ:\\n1. ВЫ НЕ ПРОШЛИ ЕЖЕКВАРТАЛЬНУЮ ПРОВЕРКУ ГИГИЕНЫ.\\n2. ЭТО СНИЗИЛО ЭФФЕКТИВНОСТЬ СЕКТОРА НА [bold]0,02%[/bold].\\n\\nПРИЛАГАЕТСЯ НАБОР ГИГИЕНИЧЕСКИХ СРЕДСТВ, ПОДХОДЯЩИХ ДЛЯ ОРГАНИКОВ. НАДЕЕМСЯ НА СКОРЕЙШЕЕ ИСПРАВЛЕНИЕ СИТУАЦИИ.\\n\\n[italic]ЭТО АВТОМАТИЧЕСКОЕ СООБЩЕНИЕ. НЕ ОТВЕЧАЙТЕ.[/italic]\\n"
