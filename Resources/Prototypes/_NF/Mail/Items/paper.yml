    - stampedColor: '#006600FF'
      stampedName: Central Admiralty of Frontier
    content: "\\n      [head=1]Космический закон — ваш щит.[/head]\\n\\n            [head=2]Им вы защищаете Фронтир.[/head][head=3]\\n[/head]\\n  [head=1]Выучите его. Держите крепко.[/head]\\n\\n    [head=2]СРП — ваш меч, не дайте ему заржаветь.[/head]\\n\\n [head=2]Сохраняйте равновесие и владейте им умело.[/head]\\n\\n\\n\\n\\n\\n\\n\\n\\n                        [head=3][italic]Внутреннее бюро пропаганды[/italic][/head]\\n"
