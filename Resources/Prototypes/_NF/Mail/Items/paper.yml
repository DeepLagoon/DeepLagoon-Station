      stampType: Signature
    content: "\\n  [head=1]Уведомление о повторном использовании органики[/head]\\n\\n[head=3]В рамках общесекторной программы Nanotrasen [color=#009900]«Снова зелёные»[/color] мы повторно использовали одного из станционных питомцев прошлой смены.\\n\\nПрилагается аварийный пищевой рацион.[/head]\\n\\n[bold]Объект:[/bold] NT-CAT-4183053 «Клиппи»\\n[bold]ДНК:[/bold] AACATATTACCGGCAT\\n[bold]Новое назначение:[/bold] Питание\\n"
