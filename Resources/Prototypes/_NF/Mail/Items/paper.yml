    content: "\\n    [head=1]Счёт[/head][head=3]\\n    Антивирусное ПО Snortin[/head]\\n\\n[head=3]Заказ №41003\\n[bold][bullet/][/bold] 1× установочный диск антивируса Snortin Total-275[/head]\\n\\n[head=3]Итого: 947381 кредит[/head]\\n\\nСпасибо за совершать покупка у Антивирусное ПО Snortin.\\nМы заверять вас, что наш продукт самый лучший.\\nПожалуйста, отправлять оплата при первой возможность.\\n"
- type: entity
  id: PaperMailNFEMPPreparedness
  categories: [ HideSpawnMenu ]
  name: EMP preparedness response form
  suffix: "emp preparedness"
  parent: Paper
  components:
  - type: Paper
    content: "\\n  [head=1]Отчёт о готовности к ЭМИ[/head]\\n\\nВас выбрали для пробного получения набора защиты от ЭМИ компании NT. Учтите, что это лишь проверка. В настоящей чрезвычайной ситуации следуйте указаниям командования вашего судна.\\n\\nПолучив этот набор, укажите [bold]любые улучшения[/bold], которые могли бы повысить готовность к ЭМИ судна, на борту которого вы находились при вскрытии посылки, и передайте этот бланк вашему капитану или представителю станции.\\n\\n[bold]Дата проверки:[/bold]\\n[bold]Количество затронутых предметов:[/bold]\\n[bold]Предполагаемая тяжесть происшествия:[/bold]\\n[bold]Предлагаемые улучшения:[/bold]\\n"
- type: entity
  id: PaperMailNFBuildABuddy
  categories: [ HideSpawnMenu ]
  name: Build-a-Buddy adoption letter
  suffix: "build-a-buddy"
  parent: Paper
  components:
  - type: Paper
    stampState: paper_stamp-generic
    stampedBy:
    - stampedColor: '#FF6699FF'
      stampedName: Chief Friendship Officer
    - stampedColor: '#333333FF'
      stampedName: Cuts-With-Scalpel
      stampType: Signature
    content: "\\n[head=1]Свидетельство об усыновлении[/head]\\n\\nТеперь вы счастливый обладатель собственного «Собери друга»!\\n\\nНадеемся, ваш новый друг станет надёжной опорой в глубинах космоса и вам там будет не так одиноко. Лично мне их сборка кажется весьма успокаивающей.\\n\\n[bold]Соберите весь набор![/bold]\\n[bold][bullet/][/bold] Грета-гоблин\\n[bold][bullet/][/bold] Генри-человек\\n[bold][bullet/][/bold] Рэнди-рептилия\\n[bold][bullet/][/bold] Стивен-слайм\\n[bold][bullet/][/bold] Валери-вульпканин\\n[bold][bullet/][/bold] Рези-резоми\\n"
