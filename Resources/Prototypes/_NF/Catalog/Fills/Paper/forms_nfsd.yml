# Forms
- type: entity # Creator: Kwentov (Vica)
  id: PaperWrittenNfsdWarrant
  name: search warrant
  parent: Paper
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: "[color=#40516e]◥[bold]N[/bold]◣ [bold]Корпус морской пехоты Транссолярной Федерации[/bold][/color]\n[color=#40516e]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Ордер на обыск[/head]\n\n[head=3]Сведения об ордере[/head]\n[bold]Объект (лицо/код опознавания судна):[/bold]\n[bold]Основание запроса:[/bold]\n[bold]Время выдачи по смене:[/bold]\n\n[head=3]Сведения о заявителе[/head]\n[bold]Номер дела:[/bold]\n[bold]Время запроса:[/bold]\n[bold]Офицер-заявитель:[/bold]\n[bold]Звание офицера:[/bold]\n\n\n\n[color=#AAAAAA]Этот ордер действителен только по запросу сотрудника TSFMC, если он утверждён, подписан и заверен печатью [italic]другим[/italic] (если это возможно) офицером в звании капитана КВП ТСФ или выше либо представителем станции.[/color]\n"
- type: entity # Creator: Starly (Shaw Clifflower)
  id: PaperWrittenNfsdReport
  name: after action report
  parent: Paper
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: "[color=#40516e]◥[bold]N[/bold]◣ [bold]Корпус морской пехоты Транссолярной Федерации[/bold][/color]\n[color=#40516e]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Отчёт по итогам операции[/head]\n\n[bold]Номер дела:[/bold]\n[bold]Судно нарушителя:[/bold]\n\n[bold]Подозреваемый:[/bold]\n[bold]Обвинения (укажите отягчающие обстоятельства):[/bold]\n\n[bold]Подозреваемый:[/bold]\n[bold]Обвинения (укажите отягчающие обстоятельства):[/bold]\n\n[bold]Прибывшее судно:[/bold]\n[bold]Время происшествия:[/bold]\n[bold]Офицеры на борту:[/bold]\n\n[head=3]Собранные доказательства[/head]\nПеречислите ниже все собранные доказательства и офицеров, у которых они находятся.\n\n\n\n[head=3]Описание происшествия[/head]\n\n\n\n[head=3]Представления к поощрению[/head]\n\n\n\n[head=3]Рекомендации[/head]\n\n\n\n[color=#AAAAAA]Я, [italic]капитан КВП ТСФ или полковник[/italic] TSFMC либо действующий от их имени сотрудник, подтверждаю правильность и достоверность всего изложенного в этом отчёте. Я осведомлён об ответственности, если какие-либо сведения будут признаны неверными, поддельными или преувеличенными.[/color]\n"
