  - type: Paper
    content: "[color=#40516e]◥[bold]N[/bold]◣ [bold]Корпус морской пехоты Транссолярной Федерации[/bold][/color]\n[color=#40516e]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Журнал дежурств[/head]\n\n[head=2]Полковник[/head]\n[bold]Имя:[/bold]\n[bold]Время заступления:[/bold]\n[bold]Время окончания дежурства:[/bold]\n\n[head=2]Офицеры[/head]\n[bold]Имя:[/bold]\n[bold]Должность:[/bold]\n[bold]Время заступления:[/bold]\n[bold]Время окончания дежурства:[/bold]\n\n[bold]Имя:[/bold]\n[bold]Должность:[/bold]\n[bold]Время заступления:[/bold]\n[bold]Время окончания дежурства:[/bold]\n\n[bold]Имя:[/bold]\n[bold]Должность:[/bold]\n[bold]Время заступления:[/bold]\n[bold]Время окончания дежурства:[/bold]\n\n\n[color=#AAAAAA]Этот бланк содержит конфиденциальные данные НТ второго класса и предназначен только для внутреннего использования TSFMC.[/color]\n"
- type: entity # Based on form made by Blumbee (Aki Suboshi)
  id: PaperWrittenNfsdContrabandTurnover
  name: contraband turnover receipt
  categories: [ HideSpawnMenu ]
  parent: Paper
  components:
  - type: Paper
    content: "[color=#40516e]◥[bold]N[/bold]◣ [bold]Корпус морской пехоты Транссолярной Федерации[/bold][/color]\n[color=#40516e]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Акт сдачи контрабанды[/head]\n\n[bold]Владелец контрабанды:[/bold]\n[bold]Общая стоимость контрабанды (FMC):[/bold]\n[bold]Выплата за FMC:[/bold] [color=#ff0000]$2,000[/color]\n[bold]Общая выплата:[/bold]\n\n[bold]Контрабанда класса 2:[/bold]\n    [bullet/]\n    [bullet/]\n    [bullet/]\n\n[bold]Контрабанда класса 3:[/bold]\n    [bullet/]\n    [bullet/]\n    [bullet/]\n\n[bold]Время смены:[/bold]\n\n\n\n[color=#AAAAAA]Этот бланк недействителен без подписей обеих сторон и печати командования Фронтира (полковника или смотрителя центральной станции «Колосс»).[/color]\n"
- type: entity # Based on form made by Blumbee (Aki Suboshi)
  id: PaperWrittenNfsdContrabandAmnesty
  name: contraband amnesty agreement
  categories: [ HideSpawnMenu ]
  parent: Paper
  components:
  - type: Paper
    content: "[color=#40516e]◥[bold]N[/bold]◣ [bold]Корпус морской пехоты Транссолярной Федерации[/bold][/color]\n[color=#40516e]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Соглашение об амнистии за контрабанду[/head]\n\n[head=3]Владелец контрабанды[/head]\n    [bold]Имя:[/bold]\n    [bold]Вид:[/bold]\n    [bold]Код опознавания судна:[/bold]\n\n[bold]Выплата за FMC:[/bold] [color=#ff0000]$2,000[/color]\n[bold]Время смены:[/bold]\n\nЭтот документ является договором между указанным выше владельцем контрабанды и командованием Фронтира.\n\nВладелец освобождается от ответственности за хранение контрабанды при условии, что все предметы контрабанды класса 3 и все предметы класса 2, не покрытые разрешением на контрабанду класса 2, сданы в разумный срок с учётом условия ниже и не использовались со злым умыслом. Несоблюдение этого документа аннулирует все действующие разрешения на контрабанду класса 2.\n\nЕсли владельцу не выплачено полное вознаграждение за сдаваемую контрабанду по указанному выше тарифу, он вправе по своему усмотрению оставить её у себя без наказания.\n\n\n\n[color=#AAAAAA]Этот бланк недействителен без подписей обеих сторон и печати командования Фронтира (полковника или смотрителя центральной станции «Колосс»).[/color]\n"
- type: entity # Based on form made by Blumbee (Aki Suboshi)
  id: PaperWrittenNfsdContrabandPermit
  name: class 2 contraband permit
  categories: [ HideSpawnMenu ]
  parent: Paper
  components:
  - type: Paper
    content: "[color=#40516e]◥[bold]N[/bold]◣ [bold]Корпус морской пехоты Транссолярной Федерации[/bold][/color]\n[color=#40516e]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Разрешение на контрабанду класса 2[/head]\n\n[bold]Владелец разрешения:[/bold]\n[bold]Экипаж владельца:[/bold]\n    [bullet/]\n    [bullet/]\n    [bullet/]\n\n[bold]Время смены:[/bold]\n\nЭто разрешение позволяет владельцу и указанным выше членам экипажа хранить и использовать контрабанду класса 2.\nНарушение соглашения об амнистии за контрабанду аннулирует это разрешение.\nПолное определение контрабанды класса 2 приведено в §6.1.4 Космического закона.\n\n\n\n[color=#AAAAAA]Это разрешение недействительно без подписи владельца, а также подписи и печати полковника[/color]\n"
- type: entity # Based on form made by Starly (Shaw Clifflower)
  id: PaperWrittenNfsdAuthorization
  name: authorization for bluespace threats
  parent: Paper
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: "[color=#40516e]◥[bold]N[/bold]◣ [bold]Корпус морской пехоты Транссолярной Федерации[/bold][/color]\n[color=#40516e]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Разрешение на борьбу с блюспейс-угрозами[/head]\n\n[bold]Капитан судна:[/bold]\n[bold]Код опознавания судна:[/bold]\n[bold]Время смены:[/bold]\n\n[bold]Выдавшее разрешение командование Фронтира:[/bold]\n    [bullet]XXXXXXXX, смотритель центральной станции «Колосс»\n    [bullet]XXXXXXXX, полковник\n\nЭтот документ разрешает указанному судну и его капитану содействовать TSFMC и властям Фронтира в устранении враждебных блюспейс-угроз Фронтиру. К ним относятся, помимо прочего:\n    [bullet] Корабли культистов\n    [bullet] Корабли Синдиката\n    [bullet] Корабли Федерации волшебников\n    [bullet] Корабли Arcadia Industries\n\nЭтот документ НЕ наделяет уполномоченную сторону статусом сотрудника правопорядка. Ей не предоставляются особые полномочия на арест, задержание и уголовное преследование лиц, связанных с Нанотрейзен.\n\n[bold]Любая контрабанда, захваченная при операциях на вражеских судах, должна быть сдана TSFMC или смотрителю центральной станции «Колосс» (далее — «смотритель») за денежное вознаграждение. Несдача контрабанды аннулирует это соглашение и может повлечь уголовное преследование уполномоченной стороны.[/bold]\n\nУполномоченная сторона обязана хранить копию документа для проверки. Для сокращения потерь следует поддерживать связь с командованием TSFMC и/или смотрителем.\n\nПеред столкновением с вражескими судами уполномоченная сторона должна выполнить все указания TSFMC по развёртыванию и иной подготовке к абордажу.\n\n\n\n[color=#AAAAAA]Этот бланк недействителен без подписей обеих сторон и печати командования Фронтира (полковника или смотрителя центральной станции «Колосс»).[/color]\n"
