    content: "[color=#40516e]◥[bold]N[/bold]◣ [bold]Корпус морской пехоты Транссолярной Федерации[/bold][/color]\n[color=#40516e]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Ордер на арест[/head]\n\n[head=2]Обвиняемые[/head]\n[bold]Имя:[/bold]\n[bold]Описание:[/bold]\n\n[bold]Имя:[/bold]\n[bold]Описание:[/bold]\n\n[bold]Имя:[/bold]\n[bold]Описание:[/bold]\n\n[head=2]Сведения о правонарушении[/head]\n[bold]Номер дела:[/bold]\n[bold]Примерное время правонарушения:[/bold]\n[bold]Место правонарушения:[/bold]\n[bold]Обвинения:[/bold]\n\n[head=2]Сведения о заявителе[/head]\n[bold]Офицер-заявитель:[/bold]\n[bold]Офицер, выдавший разрешение:[/bold]\n[bold]Время разрешения:[/bold]\n\n\n\n[color=#AAAAAA]Этот ордер действителен только по запросу сотрудника TSFMC, если он утверждён, подписан и заверен печатью другим (если это возможно) офицером в звании капитана КВП ТСФ или выше либо представителем станции.[/color]\n"
