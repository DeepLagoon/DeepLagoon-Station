    content: "[color=#40516e]◥[bold]N[/bold]◣ [bold]Корпус морской пехоты Транссолярной Федерации[/bold][/color]\n[color=#40516e]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Отчёт об аресте[/head]\n\n[head=2]Сведения о происшествии[/head]\n[bold]Номер дела:[/bold]\n[bold]Время ареста:[/bold]\n[bold]Место ареста:[/bold]\n[bold]Обвинения:[/bold]\n\n[head=2]Арестованные[/head]\n[bold]Имя:[/bold]\n[bold]Описание:[/bold]\n[bold]Штраф или наказание:[/bold]\n\n[bold]Имя:[/bold]\n[bold]Описание:[/bold]\n[bold]Штраф или наказание:[/bold]\n\n[head=2]Произвёл арест[/head]\n[bold]Офицер, произведший арест:[/bold]\n[bold]Руководитель:[/bold]\n\n\n\n[color=#AAAAAA]Я, нижеподписавшийся, клятвенно подтверждаю, что на момент подписания все сведения в этом отчёте точны и верны, насколько мне известно.[/color]\n"
