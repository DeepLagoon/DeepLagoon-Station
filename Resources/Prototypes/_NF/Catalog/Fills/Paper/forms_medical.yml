- type: entity # Based on form made by Radiantflash (Lykaon Rahmer)
  id: PaperWrittenMedicalFormHealthInsurance
  name: health insurance contract
  categories: [ HideSpawnMenu ]
  parent: Paper
  components:
  - type: Paper
    content: "[color=#2EA5E6]◥[bold]N[/bold]◣ [bold]Стандарты медицинских подрядчиков[/bold][/color]\n[color=#2EA5E6]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Договор медицинского страхования[/head]\n\n[head=3]Сведения о страхователе[/head]\n    [bold]Имя:[/bold]\n    [bold]Вид:[/bold]\n    [bold]Профессия:[/bold]\n    [bold]Код опознавания судна:[/bold]\n\n[head=3]Страховое покрытие[/head]\n    [bold]Медицинское покрытие:[/bold]\n    \\[  ] Лечение: покрытие до $5,000. (взнос $2,000)\n    \\[  ] Реанимация: покрытие до $10,000. (взнос $2,000)\n    \\[  ] Клонирование: покрытие до $25,000. (взнос $5,000)\n\n    [bold]Дополнительное покрытие:[/bold]\n    \\[  ] Буксировка: покрытие до $10,000. Только малые шаттлы. (взнос $2,000)\n    \\[  ] Буксировка: покрытие до $20,000. Только малые и средние шаттлы. (взнос $4,000)\n\n[head=3]Общий страховой взнос[/head]\n    [bold]$XX,XXX[/bold]\n\n\n[color=#AAAAAA]Этот бланк недействителен без подписей обеих сторон и печати медицинского специалиста.[/color]\n"
