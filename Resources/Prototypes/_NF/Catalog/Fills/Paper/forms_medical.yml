    content: "[color=#33ccff]◥[bold]N[/bold]◣ [bold]Платёжная ведомость заведующего СНМП[/bold][/color]\n[color=#33ccff]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Оплата медицинской диспетчерской[/head]\n\n[head=3]Сведения о подрядчике[/head]\n      [bold]Имя:[/bold]\n      [bold]Вид:[/bold]\n      [bold]Профессия:[/bold]\n\n[head=3]Описание оказанных услуг[/head]\n\n[head=3]Стоимость услуг[/head]\n    Доставка по медицинскому заказу: $0\n    Доставка материалов: $0\n    Медицинские услуги: $0\n    Прочее: $0\n\n[bold]Общая стоимость: $XXX,XXX[/bold]\n\n[color=#AAAAAA]Этот бланк недействителен без подписи и печати заведующего СНМП. Бланк не является договором. Вознаграждение за оказанные услуги определяется заведующим СНМП.[/color]\n"
