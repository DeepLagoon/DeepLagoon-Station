    content: "[color=#33ccff]◥[bold]N[/bold]◣ [bold]Платёжная ведомость заведующего СНМП[/bold][/color]\n[color=#33ccff]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Бланк выписки пациента[/head]\n\n[head=3]Сведения о пациенте[/head]\n      [bold]Имя:[/bold]\n      [bold]Вид:[/bold]\n      [bold]Профессия:[/bold]\n\n[head=3]Сведения об оказавшем помощь[/head]\n      [bold]Имя:[/bold]\n      [bold]Код опознавания судна:[/bold]\n      [bold]Время смены:[/bold]\n\n[head=3]Оказанные услуги[/head]\n\n\n\n[head=3]Примечания[/head]\n\n\n\n[head=3]Я, нижеподписавшийся, подтверждаю достоверность приведённого выше перечня услуг и согласен на выписку.[/head]\n\n\n\n[color=#AAAAAA]Этот бланк признаётся только при наличии подписи и печати заведующего СНМП. Бланк не является договором. Вознаграждение за оказанные услуги определяется заведующим СНМП.[/color]\n"
