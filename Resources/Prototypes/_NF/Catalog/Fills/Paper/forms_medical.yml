# Filled Folder
- type: entity
  id: BoxFolderMedicalDoctor
  parent: BoxFolderBase
  name: medical doctor folder
  description: A folder filled with medical paperwork templates.
  suffix: Forms
  components:
  - type: Sprite
    layers:
    - state: folder-white
    - state: folder-base
  - type: StorageFill
    contents:
    - id: PaperWrittenMedicalFormPatientInfo
    - id: PaperWrittenMedicalFormPrescription
    - id: PaperWrittenMedicalFormHealthInsurance
    - id: PaperWrittenMedicalFormServiceInvoice
    - id: PaperWrittenMedicalFormReceiptInvoice
    - id: PaperWrittenMedicalFormRelease
    - id: Paper
      prob: 0.5
    - id: Paper
      prob: 0.5
  - type: StaticPrice
    price: 100
    vendPrice: 500

# Forms
- type: entity # Loosely based on form made by Scratchie (Nova Howe) for Formal Complaint
  id: PaperWrittenMedicalFormPatientInfo
  name: medical patient record
  categories: [ HideSpawnMenu ]
  parent: Paper
  components:
  - type: Paper
    content: "[color=#2EA5E6]◥[bold]N[/bold]◣ [bold]Стандарты медицинских подрядчиков[/bold][/color]\n[color=#2EA5E6]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Медицинская карта пациента[/head]\n\n[head=3]Сведения о пациенте[/head]\n    [bold]Имя:[/bold]\n    [bold]Вид:[/bold]\n    [bold]Профессия:[/bold]\n\n[head=3]Сведения об оказавшем помощь[/head]\n    [bold]Имя:[/bold]\n    [bold]Код опознавания судна:[/bold]\n    [bold]Время смены на момент прибытия:[/bold]\n\n[head=3]Полученные повреждения[/head]\n    [bold]Механические повреждения:[/bold]\n    Ушибы: 0\n    Порезы: 0\n    Проникающие ранения: 0\n\n    [bold]Термические и химические повреждения:[/bold]\n    Нагрев: 0\n    Электричество: 0\n    Холод: 0\n    Кислота: 0\n\n    [bold]Токсические повреждения:[/bold]\n    Яд: 0\n    Радиация: 0\n\n    [bold]Генетические повреждения:[/bold]\n    Клеточные: 0\n\n    [bold]Асфиксия:[/bold]\n    Кровопотеря: 0\n    Нехватка воздуха: 0\n\n[head=3]Проведённое лечение[/head]\n    [bold]Применённые наружные средства:[/bold]\n    Наборы от ушибов: 0\n    Тюбики мази: 0\n    Бинты: 0\n    Пакеты крови: 0\n    Шовный материал: 0\n    Регенеративная сетка: 0\n\n    [bold]Введённые препараты:[/bold]\n    [bullet/] Препарат, дозировка: XX ед.\n    [bullet/] Препарат, дозировка: XX ед.\n\n\n\n[color=#AAAAAA]Этот бланк недействителен без подписи и печати медицинского специалиста.[/color]\n"
