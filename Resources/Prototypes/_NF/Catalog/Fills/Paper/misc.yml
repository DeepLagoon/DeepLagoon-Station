- type: entity
  id: PaperWrittenFrontierFridge
  name: fridge policy
  suffix: MappedPaper
  parent: Paper
  components:
  - type: Paper
    stampState: paper_stamp-centcom
    stampedBy:
    - stampedColor: '#004200FF'
      stampedName: Central Admiralty of Frontier
      stampType: RubberStamp
    - stampedColor: '#333333FF'
      stampedName: Stamps-the-Papers
      stampType: Signature
    content: "[head=1][color=#1a6295]TSF[/color][/head]\n\n[bold]КОМУ:[/bold]\nСотрудникам колониальной администрации\n\n[bold]ОТ:[/bold]\n[italic]Штампует-Бумаги[/italic]\n[bold][color=darkred]Сержант[/color][/bold], отдел факсов и вещания\n[bold][color=green]NT-CC[/color][/bold]\n\n[bold]/СООБЩЕНИЕ/[/bold]\n\nНам сообщили о расточительстве в комнате отдыха сотрудников колониальной администрации. Забирайте свою еду из холодильника до конца смены, иначе её изымут и отправят в компост.\n\nПросим присоединиться к нашим усилиям по сокращению пищевых отходов.\n\n[bold]/КОНЕЦ ФАКСА/[/bold]\n"
- type: entity
  id: PaperWrittenGriftyScript
  name: grifty's script
  suffix: MappedPaper
  parent: Paper
  components:
  - type: Paper
    content: "[color=#1b67a5]█▄ █ ▀█▀    [head=3]Сценарий общения «У Грифти»[/head]\n█ ▀█     █       Топливо и закуски «У Грифти»\n\n[bold]ВНИМАНИЕ, СОТРУДНИК МАГАЗИНА! СЛЕДУЙТЕ ЭТОМУ СЦЕНАРИЮ[/bold]\n\nПриветствие гостей:\n«Здравствуйте! Добро пожаловать к Грифти! Не хотите воспользоваться акцией „Топливо и закуски“? При каждой полной заправке плазмой — бесплатная коробка донк-покетов!»\n\nПри каждой продаже следуйте руководству Грифти! Добавляйте скрытый пятипроцентный сбор за обман. Не упоминайте этот сбор.\n\nЕсли покупатель пожалуется на сбор за обман, скажите:\n«Мы у Грифти делаем всё, чтобы обмануть вас на высшем уровне. Хорошего дня!»\n\nНе отвечайте на дальнейшие жалобы. Если гость начинает вести себя агрессивно, скажите:\n«Сожалею, что обслуживание оказалось неоптимальным. Сейчас принесу наш решатель клиентских проблем, чтобы удовлетворить ваши потребности».\n\nВозьмите решатель клиентских проблем. Решите свою проблему.\n"
- type: entity
  id: PaperWrittenGriftyWindow
  name: note the the boss
  suffix: MappedPaper
  parent: PaperOffice
  components:
  - type: Paper
    content: "Эй, босс,\n\nТрещина в плазменной камере растёт, и я переживаю за удерживающий блок. Что будет, если стекло лопнет?\n"
- type: entity
  id: PaperWrittenPartyProcedure
  name: official party preparation procedure
  parent: Paper
  components:
  - type: Paper
    stampState: paper_stamp-centcom
    stampedBy:
    - stampedColor: '#004200FF'
      stampedName: Frontier Department of Recreation
      stampType: RubberStamp
    - stampedColor: '#333333FF'
      stampedName: Plans-The-Party
      stampType: Signature
    content: "[color=#1a6295]◥[bold]N[/bold]◣ [bold]Отдел досуга[/bold][/color]\n[color=#1a6295]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=3]Официальная процедура подготовки вечеринки[/head]\n\nБлагодарим за покупку официального ящика для вечеринки, одобренного НТ.\n\nПервый шаг к вечеринке без потери времени — подготовка. Обязательно узнайте у повара или в руководстве НТ рецепт вкусного торта.\n\nСледующий шаг — приглашение гостей. Для наилучшего поднятия настроения найдите золотую середину между слишком малым и слишком большим числом людей. Обязательно заранее свяжитесь с будущими гостями по факсу или радио.\n\nПоддерживайте разумный уровень шума и избегайте ненужного разгула и пьянства. Помните: похмелье вредит и настроению, и прибыли. Соблюдайте меру во всём.\n\nПриложите все усилия, чтобы развлечь гостей с помощью содержимого ящика. Изобретательность, находчивость, лидерство и обслуживание крайне важны для правильного проведения вечеринки.\n\nРазвлекайтесь! По окончании вечеринки не забудьте отправить все использованные материалы на переработку.\n\n[italic]Отказ от ответственности: Нанотрейзен не отвечает за упущенную прибыль вследствие покупки этого ящика. Нанотрейзен не покрывает медицинские расходы, возникшие при использовании ящика и его содержимого. Нанотрейзен не гарантирует, что использование предметов из ящика принесёт удовольствие.[/italic]\n"
