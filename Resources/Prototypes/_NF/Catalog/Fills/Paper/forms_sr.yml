  - type: Paper
    content: "[color=#000f89]◥[bold]N[/bold]◣ [bold]Командование аванпоста Фронтир[/bold][/color]\n[color=#000f89]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Переименование шаттла[/head]\n\n[bold]Имя капитана:[/bold]\n[bold]Прежнее название судна:[/bold]\n[bold]Новое название судна:[/bold]\n[bold]Время смены:[/bold]\n\n\n\n[color=#AAAAAA]Этот бланк недействителен без подписей обеих сторон и печати командования Фронтира (полковника или представителя колонии).[/color]\n"
- type: entity # Based on form made by Blumbee (Aki Suboshi)
  id: PaperWrittenFrontierShuttleDerelict
  name: declaration of salvage
  parent: Paper
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: "[color=#000f89]◥[bold]N[/bold]◣ [bold]Командование аванпоста Фронтир[/bold][/color]\n[color=#000f89]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Декларация о признании судна брошенным[/head]\n\n[bold]Код опознавания судна:[/bold] [color=#2200BD][/color]\n[bold]Время первого вызова:[/bold] [color=#2200BD][/color]\n[bold]Время смены:[/bold] [color=#2200BD][/color]\n\nНастоящим официальным заявлением диспетчер движения станции Фронтир объявляет указанное судно брошенным капитаном и доступным для утилизации. Судно не отвечает ни по радио, ни по факсу более двадцати (20) минут.\n\nВ соответствии с §9.3 Космического закона представитель станции Фронтир или TSFMC переместит судно на триста (300) метров от станции Фронтир, после чего оно станет доступным для утилизации любому другому судну сектора.\n\nНи администрация TSF, ни корпорация Нанотрейзен, ни Союз расширения Фронтира, ни какая-либо иная организация не возместят убытки лицам, связанным с этим судном.\n\n\n\n[color=#AAAAAA]Этот бланк недействителен без подписей обеих сторон и печати командования Фронтира (полковника или представителя колонии).[/color]\n"
- type: entity # Based on form made by Blumbee (Aki Suboshi)
  id: PaperWrittenFrontierContrabandAmnesty
  name: contraband amnesty agreement
  parent: Paper
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: "[color=#000f89]◥[bold]N[/bold]◣ [bold]Командование аванпоста Фронтир[/bold][/color]\n[color=#000f89]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Соглашение об амнистии за контрабанду[/head]\n\n[color=#660000]Этот бланк можно выдать только в отсутствие действующего полковника или с его разрешения.[/color]\n\n[head=3]Владелец контрабанды[/head]\n    [bold]Имя:[/bold]\n    [bold]Вид:[/bold]\n    [bold]Код опознавания судна:[/bold]\n\n[bold]Выплата за FMC:[/bold] [color=#ff0000]$2,000[/color]\n[bold]Время смены:[/bold]\n\nЭтот документ является договором между указанным выше владельцем контрабанды и командованием Фронтира.\n\nВладелец освобождается от ответственности за хранение контрабанды при условии, что все предметы контрабанды класса 3 и все предметы класса 2, не покрытые разрешением на контрабанду класса 2, сданы в разумный срок с учётом условия ниже и не использовались со злым умыслом. Несоблюдение этого документа аннулирует все действующие разрешения на контрабанду класса 2.\n\nЕсли владельцу не выплачено полное вознаграждение за сдаваемую контрабанду по указанному выше тарифу, он вправе по своему усмотрению оставить её у себя без наказания.\n\n\n\n[color=#AAAAAA]Этот бланк недействителен без подписей обеих сторон и печати командования Фронтира (полковника или представителя колонии).[/color]\n"
