- type: entity # Based on form made by Starly (Shaw Clifflower)
  id: PaperWrittenFrontierAuthorization
  name: authorization for bluespace threats
  parent: Paper
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: "[color=#000f89]◥[bold]N[/bold]◣ [bold]Командование аванпоста Фронтир[/bold][/color]\n[color=#000f89]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Разрешение на борьбу с блюспейс-угрозами[/head]\n\n[color=#660000]Этот бланк можно выдать только в отсутствие действующего полковника или с его разрешения.[/color]\n\n[bold]Капитан судна:[/bold]\n[bold]Код опознавания судна:[/bold]\n[bold]Время смены:[/bold]\n\n[bold]Выдавшее разрешение командование Фронтира:[/bold]\n    [bullet]XXXXXXXX, представитель колонии\n    [bullet]XXXXXXXX, полковник\n\nЭтот документ разрешает указанному судну и его капитану содействовать TSFMC и властям Фронтира в устранении враждебных блюспейс-угроз Фронтиру. К ним относятся, помимо прочего:\n    [bullet] Корабли культистов\n    [bullet] Корабли Синдиката\n    [bullet] Корабли Федерации волшебников\n    [bullet] Корабли Arcadia Industries\n\nЭтот документ НЕ наделяет уполномоченную сторону статусом сотрудника правопорядка. Ей не предоставляются особые полномочия на арест, задержание и уголовное преследование лиц, связанных с Нанотрейзен.\n\n[bold]Любая контрабанда, захваченная при операциях на вражеских судах, должна быть сдана TSFMC или смотрителю центральной станции «Колосс» за денежное вознаграждение. Несдача контрабанды аннулирует это соглашение и может повлечь уголовное преследование уполномоченной стороны.[/bold]\n\nУполномоченная сторона обязана хранить копию документа для проверки. Для сокращения потерь следует поддерживать связь с командованием TSFMC и/или смотрителем центральной станции «Колосс».\n\nПеред столкновением с вражескими судами уполномоченная сторона должна выполнить все указания TSFMC по развёртыванию и иной подготовке к абордажу.\n\n\n\n[color=#AAAAAA]Этот бланк недействителен без подписей обеих сторон и печати командования Фронтира (полковника или смотрителя центральной станции «Колосс»).[/color]\n"
