  components:
  - type: Paper
    content: "[color=#000f89]◥[bold]N[/bold]◣ [bold]Командование аванпоста Фронтир[/bold][/color]\n[color=#000f89]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Акт сдачи контрабанды[/head]\n\n[bold]Владелец контрабанды:[/bold]\n[bold]Общая стоимость контрабанды (FMC):[/bold]\n[bold]Выплата за FMC:[/bold] [color=#ff0000]$2,000[/color]\n[bold]Общая выплата:[/bold]\n\n[bold]Контрабанда класса 2:[/bold]\n    [bullet/]\n    [bullet/]\n    [bullet/]\n\n[bold]Контрабанда класса 3:[/bold]\n    [bullet/]\n    [bullet/]\n    [bullet/]\n\n[bold]Время смены:[/bold]\n\n\n\n[color=#AAAAAA]Этот бланк недействителен без подписей обеих сторон и печати командования Фронтира (полковника или представителя колонии).[/color]\n"
- type: entity # Based on form made by Blumbee (Aki Suboshi)
  id: PaperWrittenFrontierContrabandPermit
  name: class 2 contraband permit
  parent: Paper
  categories: [ HideSpawnMenu ]
  components:
  - type: Paper
    content: "[color=#000f89]◥[bold]N[/bold]◣ [bold]Командование аванпоста Фронтир[/bold][/color]\n[color=#000f89]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color]\n[head=2]Разрешение на контрабанду класса 2[/head]\n\n[color=#660000]Этот бланк можно выдать только в отсутствие действующего полковника или с его разрешения.[/color]\n\n[bold]Владелец разрешения:[/bold]\n[bold]Экипаж владельца:[/bold]\n    [bullet/]\n    [bullet/]\n    [bullet/]\n\n[bold]Время смены:[/bold]\n\nЭто разрешение позволяет владельцу и указанным выше членам экипажа хранить и использовать контрабанду класса 2.\nНарушение соглашения об амнистии за контрабанду аннулирует это разрешение.\nПолное определение контрабанды класса 2 приведено в §6.1.4 Космического закона.\n\n\n\n[color=#AAAAAA]Это разрешение недействительно без подписи владельца, а также подписи и печати полковника.[/color]\n"
