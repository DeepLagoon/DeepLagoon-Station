#  Does not currently support prototype hot-reloading. See comments in c# file.

# Sector Frontier's Default damage for shared ship projectiles, without changing other explosions.
- type: explosion
  id: DefaultShipGun
  damagePerIntensity:
    types:
      Heat: 5
      Blunt: 5
      Piercing: 5
  tileBreakChance: [0, 0.5, 1]
  tileBreakIntensity: [0, 10, 30]
  tileBreakRerollReduction: 20
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3
  temperature: 800

- type: explosion
  id: HardBombShipGun
  damagePerIntensity:
    types:
      Heat: 2
      Blunt: 2
      Piercing: 0.5
      Structural: 2
  tileBreakChance: [ 0, 0.5, 1 ]
  tileBreakIntensity: [ 0, 15, 30 ]
  tileBreakRerollReduction: 10
  intensityPerState: 20
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3 # Mono
  temperature: 600
  fireChance: 0.4
  minFireLevel: 1
  maxFireLevel: 2

- type: explosion
  id: BottleBomb
  damagePerIntensity:
    types:
      Heat: 10
      Blunt: 2
      Piercing: 3
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 7
  fireStacks: 3
  temperature: 700
  fireChance: 0.8
  minFireLevel: 1
  maxFireLevel: 3

- type: explosion
  id: PyrogelBomb
  damagePerIntensity:
    types:
      Heat: 10
      Blunt: 2
      Piercing: 3
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 10
  fireStacks: 8
  temperature: 1500
  fireChance: 0.8
  minFireLevel: 1
  maxFireLevel: 3

