# Sustained-firepower alternative to Kite
- type: vessel
  id: Yukikaze
  parent: BaseVessel
  name: MMC-CSC Yukikaze
  description: "Корабль с чуть более серьёзной бронёй, чем у Kite: слой пластали и пластитана, да ещё и щит! Правда, в комплекте всего две AK-820, два орудия точечной обороны 14x97 мм и очень тесный интерьер. Говорят, за свою цену эти суда весьма способны и хорошо себя зарекомендовали, так что недооценивать их не стоит."
  price: 123288
  purchasable: false # Voucher only
  category: Medium
  group: Mieyo
  access: MieyoSecurity
  shuttlePath: /SharedMaps/_Mono/Shuttles/MMC/yukikaze.yml
  guidebookPage: Null
  class:
  - Patrol
  - Brawler
  engine:
  - AME

