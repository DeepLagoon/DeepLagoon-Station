- type: pointOfInterest
  id: HeliosFortress
  abstract: true # Disabled: do not spawn PDV Helios Fortress.
  parent: [BasePOI, BaseRepairablePOI]
  name: 'PDV Helios Fortress'
  minimumDistance: 22000
  maximumDistance: 27000 # somewhere in far reaches 1 or 2
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, MonoRogueTSF, MonoRogueUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce, MonoChimeraPdv ]
  spawnGroup: Required
  gridPath: /Maps/_Mono/POI/pdvhelios.yml
  addComponents:
  - type: IFF
    color: "#DE9E59"
    readOnly: true # mono
    flags:
    - HideLabelAlways # hidden
  - type: WorldGenDistanceCarver
    distanceThresholds:
    # drones no droning
    - maxDistance: 5000
      prob: 0.0
    - maxDistance: 6500
      prob: 0.3

- type: gameMap
  id: HeliosFortress
  mapName: 'PDV Helios Fortress'
  mapPath: /Maps/_Mono/POI/pdvhelios.yml
  minPlayers: 0
  stations:
    HeliosFortress:
      stationProto: RecordsFrontierOutpostCargo
      gridComponents:
      - type: VesselInfo
        description: "Здесь таится гнетущая имперская аура. Слава султану."
      - type: JamDeathrattles
        exclusions:
        - FreelanceTrackingImplant
      - type: JamOverwatch
        excludedFactions:
        - PDV
      - type: DeleteNearbyDrones
        distance: 5000
      - type: ApplyIFFFlagsToDockedShips
        flags:
        - HideLabelAlways # hide all docked ships
      components:
        - type: StationNameSetup
          mapNameTemplate: 'PDV Helio Fortress'
        - type: ExtraStationInformation
          icon: /Textures/_NF/Interface/Pirate/piratelogo.png
          stationSubtext: 'frontier-lobby-pirate-subtext'
          stationDescription: 'frontier-lobby-pirate-description'
        - type: StationJobs
          availableJobs: {}
          tags:
          - GrandVizier
        - type: StationDeadDropReporting
          messageSet: Pirate
        - type: StationDeadDropHintExempt

