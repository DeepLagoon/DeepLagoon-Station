
- type: entity
  id: LaserDrillBase
  parent: BaseMachine
  abstract: true
  components:
  - type: LaserDrill
    materials:
      RawIron: 1500
      RawGold: 1500
      RawPlasma: 1500
      RawSilver: 1500
      RawQuartz: 1500
      RawUranium: 1500
      Coal: 1500
      LithiumOre: 1500
      CopperOre: 1500
      RawBananium: 100
      RawDiamond: 100
      RawBluespace: 100
  - type: OreSiloClient
  - type: ActivatableUI
    key: enum.LaserDrillUiKey.Key
  - type: UserInterface
    interfaces:
      enum.LaserDrillUiKey.Key:
        type: LaserDrillBoundUserInterface
  - type: ItemMiner
    proto: SpawnLootOres15
    resolveRandomSpawner: true
    interval: 10
    needApcPower: false
  - type: Sprite
    offset: 0,0.5
    noRot: true
    sprite: _Mono/Structures/Machines/laserdrill.rsi
    layers:
    - map: ["computerLayerBody"]
      state: icon
    - map: ["computerLayerScreen"]
      state: unlit
      shader: unshaded
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.40,-0.40,0.40,0.40"
        density: 750
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PointLight
    radius: 0.8
    energy: 0.5
    color: "#00AACC"
  - type: PowerConsumer
    voltage: High
    drawRate: 50000
  - type: PowerConsumerMiner
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower

- type: entity
  id: LaserDrill
  name: automated laser drill
  parent: LaserDrillBase
  description: An automated drill that delivers a selected raw material directly to a linked material silo. More valuable materials take longer to mine. Requires an expedition planet and a base of 50 kW of HV power; each additional anchored drill on the same grid doubles every drill's power demand. Connect it using the silo's menu.
  components:
  - type: PlanetMiner
    requireExpedition: true
    requireGround: false # works just fine on lattice

- type: entity
  id: StationLaserDrill
  name: advanced automated laser drill
  parent: LaserDrillBase
  description: An advanced drill that delivers a selected raw material directly to a linked material silo, even in space. More valuable materials take longer to mine. Requires a base of 150 kW of HV power; each additional anchored drill on the same grid doubles every drill's power demand. Connect it using the silo's menu.
  components:
  - type: Anchorable
    flags: None # 1984
  - type: ItemMiner
    interval: 11.5 # Base cycle for RawIron; scaled by the selected material's price.
  - type: PowerConsumer
    voltage: High
    drawRate: 150000

- type: entity
  name: random ores
  id: SpawnLootOres15
  parent: MarkerBasePlaceFree
  suffix: "Laser Drill, 15"
  components:
  - type: Sprite
    layers:
    - state: green
      scale: 0.7, 0.7
    - sprite: Objects/Materials/ore.rsi
      state: plasma
    - sprite: _NF/Markers/general.rsi
      state: questionmark
      color: red
  - type: RandomSpawner
    prototypes:
    - GoldOre15
    - SteelOre15
    - PlasmaOre15
    - SilverOre15
    - SpaceQuartz15
    - UraniumOre15
    - Coal15
    - LithiumOre15
    - CopperOre15
    chance: 0.95
    offset: 0.0
    rarePrototypes:
    - BananiumOre1
    - DiamondOre1
    - BluespaceOre1
    rareChance: 0.01

