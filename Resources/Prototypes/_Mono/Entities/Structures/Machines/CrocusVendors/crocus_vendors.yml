- type: entity
  parent: ColMarTechBase
  id: ColMarTechEquipmentTSF
  name: TSF automated infantry equipment rack
  description: An automated rack hooked up to a colossal storage of standard-issue equipment.
  suffix: Crocus
  components:
  - type: Sprite
    sprite: _Crescent/Structures/armoryPF.rsi
    layers:
    - state: off
    - state: normal-unshaded
      shader: unshaded
  - type: CMAutomatedVendor
    pointsType: CrocusPoints
    sections:
    - name: "Основное оружие"
      choices: { Longarm: 1 }
      entries:
      - id: WeaponRifleLecter
        name: "QBZ-410 Лектер (6,8×52 мм безгильзовые)"
        recommended: true
        points: 1
      - id: WeaponSubMachineGunDrozd
        name: "CS/LR-8 Дрозд (.45 ACP)"
        recommended: true
      - id: WeaponLMGGrizzly
        name: "QJY-68 Гризли (6,8×52 мм безгильзовые)"
        points: 2
      - id: WeaponShotgunKammerer
        name: "Каммерер (12-й калибр)"
      - id: WeaponShotgunEnforcer
        name: "Энфорсер (12-й калибр)"
        points: 1
    - name: "Боеприпасы основного оружия"
      choices: { LongarmAmmo: 8 }
      entries:
      - id: Magazine68x52mmCaseless
        name: "Магазин на 30 патронов (6,8×52 мм безгильзовые)"
      - id: AmmoBox68x52mmCaseless
        name: "Коробка на 80 патронов (6,8×52 мм безгильзовые)"
      - id: Magazine45_ACPSubMachineGunFMJ
        name: "Магазин на 30 патронов (.45 ACP)"
      - id: AmmoBox45_ACPFMJ
        name: "Коробка на 80 патронов (.45 ACP)"
      - id: AmmoBox12_gaugeBuckshot
        name: "Коробка на 32 патрона (12-й калибр, картечь)"
      - id: AmmoBox12_gaugeSlug
        name: "Коробка на 32 патрона (12-й калибр, пуля)"
      - id: AmmoBox12_gaugeFlare
        name: "Коробка на 32 патрона (12-й калибр, сигнальные)"
      - id: 40mmGrenadeFragmentation
        name: "Осколочная граната 40 мм"
        recommended: true
      - id: 40mmGrenadeThermobaric
        name: "Термобарическая граната 40 мм"
        recommended: true
      - id: 40mmGrenadeBaton
        name: "Травматическая граната 40 мм"
      - id: 40mmGrenadeFlash
        name: "Световая граната 40 мм"
    - name: "Личное оружие"
      choices: { Sidearm: 1 }
      entries:
      - id: WeaponPistolMk58
        name: "МК-58 (.45 ACP)"
      - id: WeaponRevolverInspector
        name: "Гартер (.357 магнум)"
    - name: "Боеприпасы личного оружия"
      choices: { SidearmAmmo: 4 }
      entries:
      # NO AMMO BOX FOR THE SIDEARM!! It gets it from primary ammo anyways.
      - id: Magazine45_ACPPistolFMJ
        name: "Магазин на 17 патронов (.45 ACP)"
      - id: SpeedLoader357_magnumFMJ
        name: "Спидлоадер на 6 патронов (.357 магнум)"
      - id: AmmoBox357_magnumFMJ
        name: "Коробка на 32 патрона (.357 магнум)"
    - name: "Оружейные модули"
      choices: { Attachments: 1 }
      entries:
      - id: GunAttachmentSuppressorMulticalRifle
        name: "Винтовочный глушитель MULTI-CAL"
        points: 1
      - id: GunAttachmentSuppressorMulticalPistol
        name: "Пистолетный глушитель MULTI-CAL"
      - id: GunAttachmentGripErebusLAM
        name: "Лазерный целеуказатель «Зенит-PRL»"
      - id: GunAttachmentGripPistolLAM
        name: "Лазерный целеуказатель «Союз-PRL»"
      - id: GunAttachmentGripErebusLight
        name: "Фонарь LM-300"
      - id: GunAttachmentQLG20
        name: "Подствольный гранатомёт QLG-20 (только Лектер)"
        points: 1
    - name: "Полезное снаряжение"
      choices: { Utilities: 3 }
      entries:
      - id: CMVendorBundleNightvision
        name: "Комплект ночного видения"
        points: 1
        recommended: true
      - id: ExGrenade
        name: "Взрывная граната"
        recommended: true
        points: 1
      - id: GrenadeFlashBang
        name: "Светошумовая граната"
        recommended: true
      - id: SmokeGrenade
        name: "Дымовая граната"
        recommended: true
      - id: BreachingCharge
        name: "Заряд для взлома"
      - id: Floodlight
        name: "Прожектор"
      - id: PinpointerSyndicateCrocusBeacon
        name: "Пинпоинтер маяка радиоаплинка"
      - id: RemoteSignallerAdvanced
        name: "Дистанционный сигналлер"
      - id: DefibrillatorCompact
        name: "Компактный дефибриллятор"
        points: 1
      - id: HandheldHealthAnalyzer
        name: "Ручной анализатор здоровья"
      - id: CMVendorBundleSurgery
        name: "Хирургический набор"
        points: 1
      - id: SecBreachingHammer
        name: "Штурмовой молот"
        points: 1
      - id: WeaponShotgunHelepolis
        name: "Штурмовой дробовик UW12-B «Гелеполис»"
        points: 1
      - id: WeaponLauncherMyoko
        name: "Лёгкое противотанковое оружие F/87 «Мёко»"
        points: 2
    - name: "Очки и визоры"
      choices: { Eyewear: 1 }
      entries:
      - id: ClothingEyesHudMedSec
        name: "Медицинский визор службы безопасности"
        recommended: true
        points: 1
      - id: ClothingEyesHudSecurity
        name: "Визор службы безопасности"
        recommended: true
      - id: ClothingEyesHudMedical
        name: "Медицинский визор"
      - id: ClothingEyesHudDiagnostic
        name: "Диагностический визор"
      - id: ClothingEyesBallisticGogglesRedCrocus
        name: "Очки с защитой от вспышек"
    - name: "Медицинские принадлежности"
      choices: { Meds: 4 }
      entries:
      - id: Tourniquet
        name: "Жгут"
        recommended: true
      - id: Gauze
        name: "Марля"
        recommended: true
        points: 1
      - id: Brutepack
        name: "Перевязочный пакет"
      - id: Bloodpack
        name: "Пакет крови"
      - id: Ointment
        name: "Мазь"
    - name: "Для отдельных видов"
      choices: { SpeciesSpecific: 2 }
      entries:
      - id: ExtendedEmergencyNitrogenTankFilled
        name: "Баллон с азотом"
      - id: PowerCellMedium
        name: "Батарея"

