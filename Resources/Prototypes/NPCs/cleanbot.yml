- type: htnCompound
  id: CleanbotCompound
  branches:
    # DeepLagoon start
    - tasks:
        - !type:HTNCompoundTask
          task: CleanbotLightBulbCompound
    # DeepLagoon end
    - tasks:
        - !type:HTNCompoundTask
          task: BufferNearbyPuddlesCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

# DeepLagoon start
- type: htnCompound
  id: CleanbotLightBulbCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickBrokenLightOperator
            targetKey: CleanbotLightTarget
            targetMoveKey: TargetCoordinates

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false
            rangeKey: MeleeRange

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:TargetInRangePrecondition
              targetKey: CleanbotLightTarget
              rangeKey: InteractRange
          operator: !type:ReplaceLightBulbOperator
            targetKey: CleanbotLightTarget
# DeepLagoon end

# Picks a random puddle in range to move to and idle
- type: htnCompound
  id: BufferNearbyPuddlesCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyPuddles

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: InteractRange
          operator: !type:InteractWithOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: PuddleService
              proto: NearbyPuddles
              key: Target
