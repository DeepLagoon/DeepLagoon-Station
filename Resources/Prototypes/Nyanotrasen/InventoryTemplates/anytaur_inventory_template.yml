- type: inventoryTemplate
  id: anytaur
  slots:
    - name: jumpsuit
      slotTexture: uniform
      slotFlags: INNERCLOTHING
      stripTime: 5
      uiWindowPos: 0,2
      strippingWindowPos: 0,2
      displayName: "Комбинезон"
    - name: outerClothing
      slotTexture: suit
      slotFlags: OUTERCLOTHING
      slotGroup: MainHotbar
      stripTime: 6
      uiWindowPos: 1,2
      strippingWindowPos: 1,2
      displayName: "Верхняя одежда"
    - name: gloves
      slotTexture: gloves
      slotFlags: GLOVES
      uiWindowPos: 2,2
      strippingWindowPos: 2,2
      displayName: "Перчатки"
    - name: neck
      slotTexture: neck
      slotFlags: NECK
      uiWindowPos: 0,1
      strippingWindowPos: 0,1
      displayName: "Шея"
    - name: mask
      slotTexture: mask
      slotFlags: MASK
      uiWindowPos: 1,1
      strippingWindowPos: 1,1
      displayName: "Маска"
    - name: eyes
      slotTexture: glasses
      slotFlags: EYES
      stripTime: 2
      uiWindowPos: 0,0
      strippingWindowPos: 0,0
      displayName: "Глаза"
    - name: ears
      slotTexture: ears
      slotFlags: EARS
      stripTime: 2
      uiWindowPos: 2,0
      strippingWindowPos: 2,1
      displayName: "Уши"
    - name: head
      slotTexture: head
      slotFlags: HEAD
      uiWindowPos: 1,0
      strippingWindowPos: 1,0
      displayName: "Голова"
    - name: pocket1
      slotTexture: pocket
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 2
      uiWindowPos: 0,3
      strippingWindowPos: 0,3
      dependsOn: jumpsuit
      displayName: "Карман 1"
      stripHidden: true
    - name: pocket2
      slotTexture: pocket
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 2
      uiWindowPos: 2,3
      strippingWindowPos: 2,3
      dependsOn: jumpsuit
      displayName: "Карман 2"
      stripHidden: true
    - name: suitstorage
      slotTexture: suit_storage
      slotFlags:   SUITSTORAGE
      stripTime: 2
      uiWindowPos: 2,0
      strippingWindowPos: 2,0
#      dependsOn: outerClothing #Mono: Disable shoulder slot restrictions
      displayName: "Снаряжение скафандра"
    - name: id
      slotTexture: id
      slotFlags: IDCARD
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 2,1
      strippingWindowPos: 2,4
      dependsOn: jumpsuit
      displayName: "ID-карта"
    - name: belt
      slotTexture: belt
      slotFlags: BELT
      slotGroup: SecondHotbar
      stripTime: 5
      uiWindowPos: 3,1
      strippingWindowPos: 1,3
      displayName: "Пояс"
    - name: back
      slotTexture: back
      slotFlags: BACK
      slotGroup: SecondHotbar
      stripTime: 5
      uiWindowPos: 3,0
      strippingWindowPos: 0,4
      displayName: "Спина"
    # Frontier: wallet slot
    - name: wallet
      slotTexture: wallet
      slotFlags: WALLET
      stripTime: 6
      uiWindowPos: 2,0
      strippingWindowPos: 3,5
      dependsOn: jumpsuit
      displayName: "Кошелёк"
    # End Frontier: wallet slot
    #Mono slots
    - name: balaclava
      slotTexture: balaclava
      slotFlags: BALACLAVA
      stripTime: 6
      uiWindowPos: 2,4
      strippingWindowPos: 3,0
      displayName: "Балаклава"
    - name: leftarmband
      slotTexture: armband_left
      slotFlags: ARMBANDLEFT
      stripTime: 6
      uiWindowPos: 2,2
      strippingWindowPos: 3,1
      displayName: "Левая нарукавная повязка"
    - name: rightarmband
      slotTexture: armband_right
      slotFlags: ARMBANDRIGHT
      stripTime: 6
      uiWindowPos: 0,2
      strippingWindowPos: 3,2
      displayName: "Правая нарукавная повязка"
    - name: helmetcover
      slotTexture: helmet_cover
      slotFlags: HELMETCOVER
      stripTime: 3
      uiWindowPos: 1,5
      strippingWindowPos: 3,3
      dependsOn: head
      displayName: "Чехол на шлем"
    - name: helmetattachment
      slotTexture: helmet_attachment
      slotFlags: HELMETATTACHMENT
      stripTime: 3
      uiWindowPos: 0,5
      strippingWindowPos: 3,4
      dependsOn: head
      displayName: "Снаряжение шлема"
    #End Mono
