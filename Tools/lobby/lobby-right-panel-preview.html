&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

#dl-right-lobby .world::before{content:&quot;&quot;;position:absolute;inset:0;background:linear-gradient(90deg,#03060922,transparent 45%,#03060922);pointer-events:none}
#dl-right-lobby .left{position:absolute;left:16px;top:16px;bottom:16px;width:var(--left-width,400px);display:flex;flex-direction:column;gap:12px;container-type:inline-size}
#dl-right-lobby .left-scroll{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;scrollbar-width:thin}
#dl-right-lobby .console{position:relative;border:16px solid transparent;border-image:var(--dl-frame) 16 stretch;padding:26px;background:var(--dl-screen);background-clip:padding-box;flex-shrink:0}
#dl-right-lobby .console::after{content:&quot;&quot;;position:absolute;inset:14px;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 4px,#0000001f 4px 5px)}
#dl-right-lobby .terminal-header{font-size:10px;display:flex;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:1px solid #315a3c}
#dl-right-lobby .menu{display:grid;grid-template-columns:1fr 1fr}
#dl-right-lobby .menu button{height:42px;border:0;border-bottom:1px solid #315a3c;background:transparent;padding:0 5px;font-size:13px;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis}
#dl-right-lobby .menu button:nth-child(odd){border-right:1px solid #315a3c}
#dl-right-lobby button:hover{background-color:#82ee9920}
#dl-right-lobby button:active{background-color:#82ee9950}
#dl-right-lobby .server-copy{font-size:13px;line-height:1.7;overflow-wrap:anywhere}
#dl-right-lobby .server-copy p{margin:0}
#dl-right-lobby .scenario{color:#e5e83f}
#dl-right-lobby .vote-title{font-size:12px;line-height:1.7;margin-bottom:12px}
#dl-right-lobby .vote-choice{display:block;width:100%;background:transparent;border:0;border-bottom:1px solid #315a3c;text-align:left;padding:8px 4px;font-size:12px}
#dl-right-lobby .vote-choice[aria-pressed=true]{background:#82ee991b}
#dl-right-lobby .vote-time{text-align:center;margin:16px 0 8px;font-size:11px}
#dl-right-lobby .vote-bar{height:14px;background:#234a30;padding:3px}
#dl-right-lobby .vote-bar-fill{height:100%;width:42%;background:repeating-linear-gradient(90deg,#82ee99 0 4px,transparent 4px 7px)}
#dl-right-lobby .music{margin-top:auto;padding:20px 26px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 12px;align-items:center}
#dl-right-lobby .album{width:72px;height:72px;background:#525a57;color:#c5cbc8;display:grid;place-items:center;font-size:40px;flex-shrink:0}
#dl-right-lobby .track{min-width:0;flex:1;font-size:12px;line-height:1.65}
#dl-right-lobby .track strong{display:block;font-size:15px;font-weight:400}
#dl-right-lobby .music-controls{grid-column:1/-1;display:flex;gap:8px}
#dl-right-lobby .music-controls button{background:transparent;border:0;padding:4px;height:34px;font-size:18px;width:36px;flex-shrink:0}
#dl-right-lobby .music-controls .music-pause{flex:1;width:auto;font-size:13px}
@container(max-width:279px){#dl-right-lobby .music{grid-template-columns:minmax(0,1fr)}#dl-right-lobby .album,#dl-right-lobby .music-controls button:not(.music-pause){display:none}}
#dl-right-lobby .right{position:absolute;right:16px;top:16px;bottom:16px;width:var(--right-width,400px);display:flex;flex-direction:column}
#dl-right-lobby .entry-drawer{position:absolute;right:calc(32px + var(--right-width,400px));top:16px;bottom:16px;width:var(--drawer-width,376px);display:flex;align-items:center}
#dl-right-lobby .entry{display:flex;width:340px;max-height:100%;flex-direction:column;align-items:center;gap:12px;overflow-y:auto;min-height:0;scrollbar-width:thin}
#dl-right-lobby .drawer-toggle{position:absolute;right:0;top:calc(50% - 28px);width:32px;height:56px;border:3px solid #9aa4a1;background:#0b1810;color:#82ee99;font-size:18px;padding:0;box-shadow:inset 0 0 0 1px #394c40}
#dl-right-lobby[data-collapsed=true] .entry{display:none}
#dl-right-lobby .nova{position:relative;width:320px;height:246px;flex-shrink:0;image-rendering:pixelated}
#dl-right-lobby .nova-back{position:absolute;left:9px;top:0;width:302px;height:246px;image-rendering:pixelated}
#dl-right-lobby .nova button{position:absolute;display:grid;place-items:center;border:0;background:transparent;padding:0;image-rendering:pixelated}
#dl-right-lobby .nova button img{display:block;image-rendering:pixelated;pointer-events:none}
#dl-right-lobby .join{left:0;top:16px;width:320px;height:56px}
#dl-right-lobby .join img{width:290px;height:42px}
#dl-right-lobby .observe{left:22px;top:80px;width:278px;height:44px}
#dl-right-lobby .observe img{width:278px;height:44px}
#dl-right-lobby .setup{left:22px;top:140px;width:278px;height:74px}
#dl-right-lobby .setup img{width:278px;height:74px}
#dl-right-lobby .nova button:hover{filter:brightness(1.18)}
#dl-right-lobby .character{width:302px;height:429px;padding:26px 23px;text-align:center;font-size:13px;line-height:13px}
#dl-right-lobby .character-header{font-size:15px;line-height:15px;margin-bottom:8px}
#dl-right-lobby .character-data{display:flex;flex-direction:column;align-items:center;gap:4px}
#dl-right-lobby .balance,#dl-right-lobby .coins{height:28px;display:flex;align-items:center;justify-content:center;gap:6px}
